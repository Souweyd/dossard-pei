<style>
:root{--hot:#e5502e;--accent:#0d6b67}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0e0c0a;color:#fff;font-family:"Instrument Sans",system-ui,sans-serif;overscroll-behavior:none}
.feed{height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}.feed::-webkit-scrollbar{display:none}
.slide{position:relative;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#14110e}
.bgblur{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(28px) brightness(.55);transform:scale(1.1)}
.poster{position:relative;max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain}
.art{position:absolute;inset:0;background-size:cover;background-position:center}
.shade{position:absolute;inset:auto 0 0 0;height:62%;background:linear-gradient(transparent,rgba(0,0,0,.82));pointer-events:none}
.shadetop{position:absolute;inset:0 0 auto 0;height:130px;background:linear-gradient(rgba(0,0,0,.55),transparent);pointer-events:none}
.info{position:absolute;left:16px;right:84px;bottom:calc(88px + env(safe-area-inset-bottom));text-shadow:0 1px 6px rgba(0,0,0,.5)}
.j{display:inline-block;background:var(--hot);color:#fff;font-weight:700;font-size:.82rem;border-radius:999px;padding:3px 10px;margin-bottom:8px}
.info h2{margin:0 0 4px;font-size:1.55rem;line-height:1.08;letter-spacing:-.02em}
.info .meta{font-size:.95rem;opacity:.92}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chips span{background:rgba(255,255,255,.18);backdrop-filter:blur(6px);border-radius:999px;padding:3px 10px;font-size:.82rem;font-weight:600}
.acts{position:absolute;right:12px;bottom:calc(96px + env(safe-area-inset-bottom));display:grid;gap:16px;justify-items:center}
.acts button{all:unset;cursor:pointer;display:grid;justify-items:center;gap:4px;font-size:.7rem;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.acts .ic{width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.35);backdrop-filter:blur(8px);display:grid;place-items:center;border:1px solid rgba(255,255,255,.18)}
.acts svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.acts .on svg{fill:#ffd400;stroke:#ffd400}
.more{position:absolute;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));display:flex;gap:10px}
.more a,.more button{all:unset;cursor:pointer;flex:1;text-align:center;border-radius:999px;padding:13px 0;font-weight:700;font-size:1rem}
.more .v{background:rgba(255,255,255,.95);color:#1d1916}.more .s{background:var(--hot);color:#fff;flex:.8}
.top{position:fixed;z-index:10;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top)) 12px 0;display:flex;align-items:center;justify-content:space-between;gap:8px;pointer-events:none}
.top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:7px;font-weight:700;font-size:1rem;color:#fff;text-decoration:none;text-shadow:0 1px 4px rgba(0,0,0,.5)}.brand .lg{width:30px;height:30px}
.modes{display:flex;background:rgba(0,0,0,.4);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.15);border-radius:999px;padding:3px}
.modes a{color:#fff;text-decoration:none;font-size:.82rem;font-weight:600;padding:6px 11px;border-radius:999px;opacity:.85}.modes a.on{background:#fff;color:#1d1916;opacity:1}
.intro{flex-direction:column;text-align:center;padding:0 24px}
.intro .bgsvg{position:absolute;inset:0}.intro .bgsvg svg{width:100%;height:100%}
.intro .in{position:relative;margin-top:-18vh}.intro .lgbig{width:84px;height:84px}
.intro h1{margin:10px 0 6px;font-size:2.3rem;letter-spacing:-.04em}.intro p{margin:0;opacity:.9;font-size:1.05rem}
.intro .cnt{margin-top:18px;font-weight:600;opacity:.95}
.hint{position:absolute;bottom:calc(40px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-weight:600;font-size:.95rem;animation:b 1.6s ease-in-out infinite}
.hint svg{display:block;margin:0 auto 4px;width:28px;height:28px;stroke:#fff;fill:none;stroke-width:2.2}
@keyframes b{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#fff;color:#1d1916;border-radius:999px;padding:8px 16px;font-weight:600;font-size:.9rem;opacity:0;transition:opacity .2s;z-index:20}.toast.show{opacity:1}
.sheet{position:fixed;inset:auto 0 0 0;z-index:30;max-height:82dvh;overflow:auto;background:#fffcf7;color:#2a211c;border-radius:20px 20px 0 0;padding:18px 18px 30px;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:none}.sheet h3{margin:0 0 4px;font-size:1.3rem}.sheet table{width:100%;border-collapse:collapse;font-size:.92rem;margin-top:12px}.sheet td,.sheet th{text-align:left;padding:7px 6px 7px 0;border-bottom:1px solid #e6dccf}.sheet th{font-size:.72rem;text-transform:uppercase;color:#776a5f}
.sheet .x{float:right;all:unset;cursor:pointer;font-size:1.6rem;line-height:1;float:right}
.sheet .note{color:#776a5f;font-size:.88rem;margin-top:12px}
.veil{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .3s}.veil.open{opacity:1;pointer-events:auto}
.tag{position:fixed;z-index:40;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));background:#ffd400;color:#000;font-size:.7rem;font-weight:700;padding:3px 8px;border-radius:6px;opacity:.85}
@media (min-width:700px){.feed{max-width:430px;margin:0 auto;border-left:1px solid #222;border-right:1px solid #222}.top{max-width:430px;margin:0 auto}}

<script>
const MOIS=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."],JOURS=["dim.","lun.","mar.","mer.","jeu.","ven.","sam."];
const DISC={trail:"Trail",route:"Route",marche:"Rando",cross:"Cross",multisport:"Multisport",relais:"Relais",jeunes:"Jeunes",autre:"Autre"};
const MULTI=["triathlon","duathlon","aquathlon","swimrun","raid-multisport","biathlon"];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const typ=e=>MULTI.includes(e.type)?"multisport":e.type;
const disc=r=>["trail","route","cross","multisport","relais","marche","autre","jeunes"].find(t=>(r.epreuves||[]).some(e=>typ(e)===t))||"autre";
const fmt=k=>String(+k.toFixed(1)).replace(".",",");
const I={fav:'<path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/>',share:'<path d="M12 15V3M7 8l5-5 5 5M5 13v7h14v-7"/>',map:'<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/>',cal:'<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>'};
const today=new Date();today.setHours(0,0,0,0);
let FAV=new Set();try{FAV=new Set(JSON.parse(localStorage.getItem("dp-favs")||"[]"))}catch(e){}
const toast=t=>{const x=document.getElementById("toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),1600)};
fetch("/data.json").then(r=>r.json()).then(d=>{
  const rs=d.races.filter(r=>!r.hidden&&new Date(r.date)>=today).sort((a,b)=>a.date.localeCompare(b.date));
  document.getElementById("cnt").textContent=rs.length+" courses à venir";
  const feed=document.getElementById("feed");
  rs.forEach(r=>{
    const dt=new Date(r.date+"T00:00"),n=Math.round((dt-today)/864e5),k=disc(r);
    const kms=[...new Set((r.epreuves||[]).filter(e=>e.km).map(e=>e.km))].sort((a,b)=>b-a).slice(0,3);
    const img=r.poster_lg||r.poster;
    const s=document.createElement("section");s.className="slide";s.dataset.id=r.id;
    s.innerHTML=(img?`<div class="bgblur" style="background-image:url('/${img}')"></div><img class="poster" src="/${img}" alt="Affiche ${esc(r.nom)}" loading="lazy">`:`<div class="art" style="background-image:url('/art/${k}.svg')"></div>`)+
    `<div class="shadetop"></div><div class="shade"></div>
    <div class="info"><span class="j">${n===0?"Aujourd'hui":n===1?"Demain":"J-"+n}</span><h2>${esc(r.nom)}</h2>
    <div class="meta">${JOURS[dt.getDay()]} ${dt.getDate()} ${MOIS[dt.getMonth()]} · ${esc(r.commune)}</div>
    <div class="chips"><span>${DISC[k]}</span>${kms.map(x=>`<span>${fmt(x)} km</span>`).join("")}</div></div>
    <div class="acts">
      <button data-a="fav" class="${FAV.has(r.id)?"on":""}"><span class="ic"><svg viewBox="0 0 24 24">${I.fav}</svg></span>Favori</button>
      <button data-a="share"><span class="ic"><svg viewBox="0 0 24 24">${I.share}</svg></span>Partager</button>
      <button data-a="map"><span class="ic"><svg viewBox="0 0 24 24">${I.map}</svg></span>Carte</button>
      <button data-a="cal"><span class="ic"><svg viewBox="0 0 24 24">${I.cal}</svg></span>Agenda</button></div>
    <div class="more"><button class="v" data-a="more">Voir plus</button>${r.inscription&&!r.complet?`<a class="s" href="${esc(r.inscription)}" target="_blank" rel="noopener">S'inscrire</a>`:""}</div>`;
    s.querySelectorAll("[data-a]").forEach(b=>b.addEventListener("click",()=>act(b.dataset.a,r,b)));
    feed.appendChild(s);
  });
});
function act(a,r,b){
  const url=location.origin+"/course/"+r.id+"/";
  if(a==="fav"){FAV.has(r.id)?FAV.delete(r.id):FAV.add(r.id);b.classList.toggle("on");try{localStorage.setItem("dp-favs",JSON.stringify([...FAV]))}catch(e){};toast(FAV.has(r.id)?"Ajouté aux favoris":"Retiré des favoris")}
  if(a==="share"){if(navigator.share)navigator.share({title:r.nom,url}).catch(()=>{});else{navigator.clipboard?.writeText(url);toast("Lien copié")}}
  if(a==="map")location.href="/#c-"+r.id;
  if(a==="cal")toast("Ajout à l'agenda (comme sur le site)");
  if(a==="more")sheet(r);
}
function sheet(r){
  const sh=document.getElementById("sheet"),v=document.getElementById("veil");
  const rows=(r.epreuves||[]).map(e=>`<tr><td>${esc(e.nom)}</td><td>${e.km?fmt(e.km)+" km":"–"}</td><td>${e.dp?e.dp+" m":"–"}</td><td>${esc(e.h||"–")}</td><td>${esc(e.prix||"–")}</td></tr>`).join("");
  sh.innerHTML=`<button class="x" aria-label="Fermer">×</button><h3>${esc(r.nom)}</h3><div>${esc(r.commune)}${r.lieu&&r.lieu!==r.commune?" · "+esc(r.lieu):""}</div>
  <table><tr><th>Épreuve</th><th>Dist.</th><th>D+</th><th>Départ</th><th>Tarif</th></tr>${rows}</table>
  <p class="note">Dans le vrai site, ce panneau montre la fiche complète : carte du parcours, profil, GPX, sources.</p>`;
  sh.classList.add("open");v.classList.add("open");
  const close=()=>{sh.classList.remove("open");v.classList.remove("open")};sh.querySelector(".x").onclick=close;v.onclick=close;
}
</script></body></html>
