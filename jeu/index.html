<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1d4f9c">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Une histoire de dossard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout : le profil de la course est la crête du décor, le coureur y avance ; dessous, une colonne de jeu. Charte Dossard Péi. */
:root {
  --bg: #f5efe6; --surface: #ffffff; --fg: #1d2523; --muted: #5b6763; --line: #e0d7c9;
  --hot: #e5502e; --teal: #0d6b67; --sun: #ffd400; --orange: #b93d15; --red: #c62828; --ok: #0d6b67;
  --ink-on-sun: #1d2523; --c-e: #c8611a; --c-h: #2a6fb0; --c-j: #0d8a5f; --c-m: #8a4fb3;
  --display: "Saira Condensed", "Arial Narrow", sans-serif; --body: "Instrument Sans", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #171c1b; --surface: #20272a; --fg: #eef0ec; --muted: #a7b0ac; --hot: #ff6a45; --line: #343d3b; --teal: #5cc3bc; --ok: #5cc3bc; --orange: #f08a5d; --red: #ff7a70; --c-e: #d4763a; --c-h: #4f8fd0; --c-j: #2ba377; --c-m: #a578cf; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #171c1b; --surface: #20272a; --fg: #eef0ec; --muted: #a7b0ac; --hot: #ff6a45; --line: #343d3b; --teal: #5cc3bc; --ok: #5cc3bc; --orange: #f08a5d; --red: #ff7a70; --c-e: #d4763a; --c-h: #4f8fd0; --c-j: #2ba377; --c-m: #a578cf; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font: 17px/1.5 var(--body); }
h1, h2, h3, p { margin: 0 }
h1, h2, h3 { font-family: var(--display); font-weight: 800; line-height: .98; text-wrap: balance }
button { font: inherit; color: inherit; cursor: pointer }
:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px }

/* Décor */
#decor { position: relative; height: clamp(170px, 30vh, 250px); overflow: hidden; transition: background 1.1s linear }
#decor > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block }
#far, #near { transition: filter 1.1s linear }
#runner { position: absolute; z-index: 2; display: grid; place-items: center; font: 800 .72rem/1 var(--body); color: #1d2523; width: 22px; height: 22px; margin: -19px 0 0 -11px; border-radius: 50%; background: var(--sun); border: 3px solid #1d2523; transition: left .9s ease-in-out, top .9s ease-in-out; box-shadow: 0 0 0 3px rgba(255,255,255,.55) }
.kms { position: absolute; left: 0; right: 0; bottom: 3px; height: 16px; font-size: .72rem; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums }
.kms span { position: absolute; transform: translateX(-50%) }
.kms span:first-child { transform: none; padding-left: 6px } .kms span:last-child { transform: translateX(-100%); padding-right: 6px }

#didier { position: absolute; z-index: 1; display: grid; place-items: center; font: 800 .66rem/1 var(--body); color: #fff; width: 19px; height: 19px; margin: -17px 0 0 -9.5px; border-radius: 50%; background: #c2410c; border: 2px solid #fff; transition: left .9s ease-in-out, top .9s ease-in-out }
#threatDot { position: absolute; top: -17px; left: 50%; margin-left: -9px; width: 18px; height: 18px; border-radius: 50%; background: #c62828; color: #fff; display: grid; place-items: center; font: 800 .76rem/1 var(--body); animation: couve 1.5s ease-in-out infinite }
@keyframes couve { 50% { transform: scale(1.25) } }

#decor.race { height: clamp(196px, 27vh, 226px) }
#raceOv { position: absolute; inset: 0; pointer-events: none }
.hudB { position: absolute; z-index: 3; top: 8px; left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); display: flex; justify-content: space-between; gap: 6px; align-items: start }
.pill { background: #fffdf8; color: #1d2523; border: 2px solid #1d2523; border-radius: 10px; padding: 4px 9px 3px; display: grid; gap: 0; box-shadow: 0 3px 0 #1d2523; font-variant-numeric: tabular-nums; transition: background .25s }
.pill small { font-size: .62rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #5b6763 }
.pill b { font: 800 1.75rem/1.02 var(--display); white-space: nowrap }
.pill b em { font: 700 .9rem var(--display); color: #5b6763; font-style: normal; margin-left: 3px }
.pill.kmp { background: var(--sun); text-align: center } .pill.kmp small { color: #1d2523 } .pill.kmp b { font-size: 1.4rem }
.pill.gain { background: #bfe8c8 } .pill.loss { background: #f5c6c0 }
#raceOv .bare { position: absolute; z-index: 2; width: 56px; left: 0; top: 0; border: 0; border-radius: 0; background: none; overflow: visible; transform: translate(-50%, -93%) rotate(var(--lean, 0deg)); transform-origin: 50% 93%; transition: left .9s ease-in-out, top .9s ease-in-out, transform .9s ease-in-out }
#raceOv .bare #threatDot { top: -9px; left: 74%; margin-left: 0; z-index: 3 }
#raceOv .bare svg > path:first-of-type { display: none }

/* Colonne */
#wrap { max-width: 600px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 44px; display: grid; gap: 16px }
#hud { display: grid; gap: 10px }
.line { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-variant-numeric: tabular-nums; flex-wrap: wrap }
.km { font: 800 1.9rem/1 var(--display) }
.stat { font-size: .88rem; color: var(--muted) } .stat b { color: var(--fg); font-weight: 600 }
.gauges { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px }
.g { position: relative; display: grid; gap: 4px; min-width: 0 }
.sub { font-size: .84rem; font-weight: 600; min-height: 1.3em; align-items: center }
.sub .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #c2410c; margin-right: 6px }
.sub #hThreat { color: var(--red) }
.float { position: absolute; right: 26px; top: -2px; font: 800 1.05rem/1 var(--display); pointer-events: none; animation: flotte 1.3s ease-out forwards; font-variant-numeric: tabular-nums }
.float.up { color: var(--ok) } .float.down { color: var(--red) }
@keyframes flotte { 0% { transform: translateY(8px); opacity: 0 } 15% { opacity: 1 } 100% { transform: translateY(-20px); opacity: 0 } }
.g.hit .bar { animation: hit .5s ease-out } @keyframes hit { 30% { transform: scaleY(1.9) } }
.shake { animation: shake .42s ease-in-out }
@keyframes shake { 20% { transform: translateX(-7px) } 40% { transform: translateX(6px) } 60% { transform: translateX(-4px) } 80% { transform: translateX(3px) } }
fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 8px; min-width: 0 }
legend { padding: 0; font: 800 1.45rem/1.1 var(--display) }
.pq { font-size: .95rem; color: var(--muted) }
.opt { display: block; position: relative; background: var(--surface); border: 2px solid var(--line); border-radius: 10px; padding: 11px 14px; font-weight: 500; line-height: 1.35; cursor: pointer }
.opt input { position: absolute; opacity: 0; width: 1px; height: 1px }
.opt:hover { border-color: var(--teal) }
.opt:has(input:checked) { background: var(--sun); color: #1d2523; border-color: #1d2523; font-weight: 600 }
.opt:has(input:focus-visible) { outline: 3px solid var(--teal); outline-offset: 2px }
.prepform { display: grid; gap: 22px }
.stickygo { width: 100% }
.cta:disabled { background: var(--line); color: var(--muted); border-color: var(--line); cursor: not-allowed; filter: none }
.recap { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none }
.recap b { display: block; font: 700 1.1rem/1.2 var(--display) }
.chart { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 6px; min-width: 0 }
.chart svg { display: block; width: 100%; touch-action: pan-y }
.chart text { font: 500 11px var(--body); fill: var(--muted) }
.chart text.mk { font-weight: 800; fill: #fff; font-size: 10px }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .8rem }
.legend i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px }
.readout { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; min-height: 1.3em }
.film li i { display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--fg); color: var(--bg); font: 800 .68rem/1 var(--body) }
.film li { grid-template-columns: 18px 4em minmax(0, 1fr) !important }
.storyimg { display: block; width: min(260px, 70%); height: auto; margin: 0 auto; border-radius: 10px; border: 1px solid var(--line) }
.g div:first-child { display: flex; justify-content: space-between; gap: 4px; font-size: .76rem; font-weight: 600 }
.g span:last-child { font-variant-numeric: tabular-nums; color: var(--muted) }
.bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden }
.bar i { display: block; height: 100%; background: var(--ok); transition: width .6s ease, background .3s }
.g.warn .bar i { background: var(--orange) } .g.crit .bar i { background: var(--red) }
.g.crit div:first-child, .g.crit span:last-child { color: var(--red) }

#panel { display: grid; gap: 14px }
.eyebrow { font-size: .76rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted) }
.scene h2 { font-size: clamp(2rem, 7vw, 2.5rem); margin-top: 2px }
.scene p.q { margin-top: 8px; max-width: 62ch }
.choices { display: grid; gap: 10px }
.choice { text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 10px; padding: 13px 15px; font-weight: 500; line-height: 1.35; transition: border-color .12s, transform .12s }
.choices.armed .choice:hover { border-color: var(--teal) } .choice:active { transform: translateY(1px) }
.cta { background: var(--sun); color: var(--ink-on-sun); border: 2px solid #1d2523; border-radius: 10px; padding: 12px 18px; font: 800 1.3rem/1 var(--display); letter-spacing: .01em; }
.cta:hover { filter: brightness(1.05) }
.ghost { background: transparent; border: 2px solid var(--line); border-radius: 10px; padding: 11px 15px; font-weight: 600; text-decoration: none; color: var(--fg); display: inline-block; text-align: center }
.ghost:hover { border-color: var(--teal) }
.result { max-width: 62ch }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chip { font-size: .82rem; font-weight: 600; padding: 2px 9px; border-radius: 99px; border: 1.5px solid currentColor; font-variant-numeric: tabular-nums }
.chip.up { color: var(--ok) } .chip.down { color: var(--red) } .chip.neutral { color: var(--muted) }

/* Dossard */
.bib { position: relative; background: #fffdf8; color: #1d2523; border: 1px solid #d9d0c0; border-radius: 6px; box-shadow: 0 3px 0 #d9d0c0; padding: 16px 26px 16px; display: grid; gap: 4px; overflow: hidden }
.bib::before, .bib::after { content: ""; position: absolute; width: 11px; height: 11px; border-radius: 50%; background: var(--bg); border: 1.5px solid #9d958a; top: 8px }
.bib::before { left: 8px } .bib::after { right: 8px }
.bib .pin { position: absolute; width: 11px; height: 11px; border-radius: 50%; background: var(--bg); border: 1.5px solid #9d958a; bottom: 8px }
.bib .pin.l { left: 8px } .bib .pin.r { right: 8px }
.bib .top { display: flex; justify-content: space-between; gap: 10px; font-size: .74rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #5b6763 }
.bib .num { font: 800 clamp(3.4rem, 15vw, 4.8rem)/.95 var(--display); font-variant-numeric: tabular-nums; letter-spacing: .01em }
.bib .band { height: 7px; background: var(--sun); margin-inline: -26px }
.bib .who { font: 700 1.25rem/1.1 var(--display) }
.bib .desc { font-size: .92rem; color: #4c5754 }
.home h1 { font-size: clamp(3rem, 13vw, 4.4rem) }
.home .lede { margin-top: 8px; max-width: 58ch }
.courses { display: grid; gap: 10px }
.course { text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 10px; padding: 13px 15px; display: grid; gap: 3px }
.course:hover { border-color: var(--teal) }
.course b { font: 800 1.45rem/1.05 var(--display) }
.course span { color: var(--muted); font-size: .92rem; font-variant-numeric: tabular-nums }
.hero { display: grid; grid-template-columns: 128px minmax(0, 1fr); gap: 14px; align-items: center }
.stage { position: relative; border-radius: 10px; overflow: hidden; border: 2px solid #1d2523; background: linear-gradient(#5fb0e6, #cfe8f6 70%) }
.stage > svg { display: block; width: 100%; height: auto }
.flip { transition: transform .18s ease-in; transform-origin: 100px 150px; transform-box: view-box }
.flip.turning { transform: scaleX(.02) }
.fold { display: block; width: 100%; background: #fffdf8; color: #1d2523; border: 0; border-top: 2px solid #1d2523; padding: 5px 8px; font-size: .78rem; font-weight: 700 }
.bob { animation: bob 2.4s ease-in-out infinite alternate }
@keyframes bob { from { transform: translateY(0) } to { transform: translateY(-2px) } }
.legA, .legB { transform-box: fill-box; transform-origin: 50% 0; animation: leg .6s ease-in-out infinite }
.legB { animation-delay: -.3s }
@keyframes leg { 0%, 100% { transform: none } 50% { transform: translateY(-7px) scaleY(.7) } }
.armA, .armB { transform-box: fill-box; transform-origin: 80% 5%; animation: arm .6s ease-in-out infinite alternate }
.armB { animation-delay: -.6s }
@keyframes arm { from { transform: rotate(-11deg) } to { transform: rotate(13deg) } }
.ombre { transform-box: fill-box; transform-origin: center; animation: ombre .3s ease-in-out infinite alternate }
@keyframes ombre { to { transform: scale(.82) } }
.sol { animation: sol .5s linear infinite } @keyframes sol { to { stroke-dashoffset: -44 } }
.blink { transform-box: fill-box; transform-origin: center; animation: blink 3.6s infinite }
@keyframes blink { 0%, 94%, 100% { transform: none } 97% { transform: scaleY(.1) } }
.goutte { animation: goutte 1.2s ease-in infinite } @keyframes goutte { 0% { transform: translate(0, -4px); opacity: 0 } 25% { opacity: 1 } 100% { transform: translate(5px, 26px); opacity: 0 } }
.fm { display: none }
.stage:not(.mood-tired):not(.mood-crit):not(.reac-aie):not(.reac-yes) .m-ok { display: inline }
.stage.mood-tired:not(.reac-aie):not(.reac-yes) .m-tired { display: inline }
.stage.mood-crit:not(.reac-aie):not(.reac-yes) .m-crit { display: inline }
.stage.reac-aie .m-aie, .stage.reac-yes .m-yes { display: inline }
.eq { display: none }
.b-gros .eq-gros, .b-sac5 .eq-sac5, .b-ceinture .eq-ceinture, .d-rougail .eq-rougail, .d-pain .eq-pain, .l-frontale .eq-frontale, .l-frontale2 .eq-frontale2, .l-tel .eq-tel { display: inline }
.run .eq-pain, .run .eq-tel { display: none !important }
.shoe { transform-box: fill-box; transform-origin: center }
.s-vieilles .shoe { fill: #a39c8e } .s-grandes .shoe { transform: scale(1.55, 1.2); fill: #2f7fc9 }
.d-cafe:not(.run) .bob { animation: nerf .09s linear infinite alternate } @keyframes nerf { from { transform: translateX(-1.2px) } to { transform: translateX(1.2px) } }
.run .bob { animation: bobr .3s ease-in-out infinite alternate } @keyframes bobr { from { transform: translateY(1px) } to { transform: translateY(-4px) } }
.run.mood-crit .legA, .run.mood-crit .legB, .run.mood-crit .armA, .run.mood-crit .armB { animation-duration: 1.2s }
.run.mood-crit .bob { animation-duration: .6s }
.reac-yes .bob { animation: saut .4s ease-out 2 alternate !important } @keyframes saut { to { transform: translateY(-16px) } }
.reac-aie { animation: shake .42s ease-in-out }
.herohud { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 10px; align-items: center }
.herohud .col { display: grid; gap: 7px; min-width: 0 }
.herohud .km { font-size: 1.6rem } .herohud .gauges { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 10px }
.prepfig { position: sticky; top: calc(8px + env(safe-area-inset-top, 0px)); z-index: 3; display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px }
.prepfig p { font-size: .95rem }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px }
.obj { position: relative; display: grid; gap: 2px; align-content: start; background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 6px 8px 10px; cursor: pointer; min-width: 0; transition: opacity .2s, border-color .15s }
.obj input { position: absolute; opacity: 0; width: 1px; height: 1px }
.obj:hover { border-color: var(--teal) } .obj:has(input:focus-visible) { outline: 3px solid var(--teal); outline-offset: 2px }
.obj .t { font-size: .84rem; font-weight: 600; line-height: 1.25 }
.fset-done .obj:not(:has(input:checked)) { opacity: .72 }
.obj:has(input:checked) { border-color: #1d2523; background: var(--sun); color: #1d2523; opacity: 1 }
.art { display: block; width: 100%; height: auto; overflow: visible }
.flotte { animation: flotte 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center }
.sh { animation: omb 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center }
.c2 .flotte, .c2 .sh { animation-delay: -1s } .c3 .flotte, .c3 .sh { animation-delay: -2s }
@keyframes flotte { 0%, 100% { transform: translateY(5px) rotate(-3deg) } 50% { transform: translateY(-6px) rotate(3deg) } }
@keyframes omb { 0%, 100% { transform: scale(1); opacity: .28 } 50% { transform: scale(.72); opacity: .14 } }
.pop { transform-box: fill-box; transform-origin: center } .obj:has(input:checked) .pop { animation: pop .45s cubic-bezier(.3, 1.7, .5, 1) }
@keyframes pop { 0% { transform: scale(.8) } 60% { transform: scale(1.2) } 100% { transform: scale(1) } }
.intro { display: grid; gap: 12px }
.line3 { font-size: .9rem; color: var(--muted); font-variant-numeric: tabular-nums }
.goalrow { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; align-items: center }
.who2 { font: 800 2rem/1 var(--display) }
.rpg { display: grid; gap: 3px; margin: 6px 0 0; font-size: .8rem; white-space: nowrap; font-variant-numeric: tabular-nums }
.rpg div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dotted currentColor; padding-bottom: 2px }
.rpg dt { font-weight: 500 } .rpg dd { margin: 0; font-weight: 700 }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 13px 14px; display: grid; gap: 8px; min-width: 0 }
.card h3 { font-size: 1.5rem }
.card .blurb { font-size: .95rem }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px }
.tile { background: var(--bg); border-radius: 10px; padding: 7px 9px; display: grid; gap: 1px; min-width: 0 }
.tile b { font-size: .98rem; font-variant-numeric: tabular-nums; white-space: nowrap }
.tile span { font-size: .64rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 600 }
.tile svg { width: 17px; height: 17px; fill: none; stroke: var(--teal); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round }
.profile { width: 100%; height: auto; display: block; touch-action: pan-y; cursor: crosshair }
.profile .area { fill: var(--hot); opacity: .18 } .profile .ln { fill: none; stroke: var(--hot); stroke-width: 2 }
.profile text { font: 500 10px var(--body); fill: var(--muted) } .profile .grid { stroke: var(--line) }
.pf-v { stroke: var(--fg); stroke-width: 1; stroke-dasharray: 3 2; opacity: .6 } .pf-dot { fill: #1d4f9c; stroke: #fff; stroke-width: 2 }
.pf-lab rect { fill: var(--fg) } .profile .pf-lab text { fill: var(--bg); text-anchor: middle }
.wx { --g1: #5fb3ec; --g2: #2f7fc9; border-radius: 16px; padding: 12px 14px; color: #fff; background: linear-gradient(145deg, var(--g1), var(--g2)); display: grid; gap: 6px }
.wx.k-sun { --g1: #c9701a; --g2: #a8480f } .wx.k-part { --g1: #3f8fd0; --g2: #2569ab } .wx.k-rain { --g1: #4f86b8; --g2: #2a4f7a }
.wxh { display: flex; align-items: center; gap: 8px } .wxh h4 { margin: 0; font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 700 }
.wxtag { margin-left: auto; font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 3px 9px; border-radius: 99px; background: rgba(255,255,255,.22) }
.wxsrc2 { margin-left: auto; font-size: .72rem }
.wxl { display: grid; grid-template-columns: 34px minmax(0, 1fr); column-gap: 10px; align-items: center }
.wxsv { width: 32px; height: 32px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; display: block }
.wxm b { display: block; font-size: 1.05rem } .wxm small { font-size: .78rem }

function didierFar(s) { return Math.abs(didierGap(s)) > (s.f.dist > 120 ? 120 : s.f.dist > 60 ? 60 : s.f.dist > 40 ? 30 : s.f.dist > 20 ? 15 : 6); }
function didierText(s) {
  const gap = didierGap(s);
  if (didierFar(s)) return gap > 0
    ? "Le t-shirt orange, là-haut, tout petit. C'est Didier. Je le rattraperai jamais. Enfin, sauf si je fais une connerie."
    : "On me crie que Didier est loin derrière et qu'il demande s'il reste du gâteau. Je me retourne pas.";
  return gap > 0
    ? "Le t-shirt orange, juste devant. C'est Didier. Il marche en se tenant les côtes. Il m'a pas vu."
    : "Ce souffle derrière moi, je le connais. Didier. Il revient. Il va pas me la faire, celle-là.";
}
function didierChoices(s) {
  const far = didierFar(s), gap = didierGap(s);
  return [
    ch("Je sprinte, maintenant", s2 => s2.g.j > 30
      ? { r: far ? "Le dossard {d} sprinte tout seul, on ne sait pas contre qui. Il doit avoir ses raisons." : "Oh le sprint du dossard {d} ! Il y a une histoire de famille là-dessous, et des samoussas en jeu.", j: -22, t: -3.2, m: 6 }
      : { r: "Le dossard {d} tente un sprint. Dix secondes. Merci d'avoir essayé.", j: -26, t: -1, m: 6 }),
    ch("J'attends la dernière ligne droite", { r: "Le dossard {d} ne s'affole pas. Il attend son moment, ou alors il ne sent plus ses pieds.", j: -8, t: -.8, m: 3 }),
    far && gap > 0
      ? ch("Tant pis pour les letchis", { r: "Le dossard {d} lève le pied. Il achètera ses letchis au marché, comme tout le monde.", j: 4, t: 1, m: 6 })

    depart: { q: "4 h du matin. Réveil à 1 h 45, conforme au plan. Tout le monde a l'air de savoir ce qu'il fait. Moi, je le sais vraiment.", r: ["{S} part à l'allure prévue, sans une seconde d'écart. C'est presque inquiétant.", "{S} suit un groupe bien trop rapide. Sa montre vient de protester, on l'a entendue depuis la route.", "{S} discute avec sa voisine et lui explique son plan de course. La voisine ralentit."] },
    ravito1: { q: "Km 9. J'ai pas faim, mais mon tableau dit 60 g de glucides. Le tableau a raison.", r: ["{S} mange sans faim, en comptant. C'est ça, la méthode.", "Un verre d'eau pour {s}, et elle repart. Elle mangera à la minute 95, c'est décidé.", "{S} a trouvé le café des bénévoles. Elle demande de quelle origine il est."] },
    montee: { q: "1 000 mètres de D+. Ma référence, c'est 700 m par heure. Il y a des gens avec des bâtons. Moi, j'ai pesé les bâtons et je les ai laissés.", r: ["Regardez-moi {s} ! Elle grimpe en courant ! Son plan vient de sortir du parcours !", "{S} se coupe deux bâtons en goyavier. Elle les a sûrement pesés. Je ne sais pas si c'est autorisé.", "{S} monte au pas, à 702 mètres par heure. Vous pouvez régler vos montres sur elle."] },
    sommet: { q: "Le sommet, avec 90 secondes d'avance. Le vent et la brume n'étaient pas dans mes prévisions. Le bénévole non plus.", r: ["{S} reste avec le bénévole du sommet et lui demande depuis combien de temps il est là. Elle a l'air touchée.", "{S} repart aussitôt. Il fait 8 degrés, et elle avait prévu 11.", "Selfie de {s} dans la brume. On voit surtout son cardio, sur la montre.", ] },
    base: { q: "Mi-course. Arrêt prévu : 6 minutes. Du riz, du poulet, une chaise. Mon plan interdit la chaise. Mes jambes contestent.", r: ["{S} mange assise, et elle a laissé passer les 6 minutes. Je l'ai vue regarder le chrono, puis ne rien faire.", "{S} repart avec une cuisse de poulet, en respectant ses 6 minutes. Une belle image.", "{S} passe devant le poulet sans s'arrêter. C'est un plan, je suppose."] },
    chaleur: { q: "Il fait 4 degrés de plus que la prévision. Une ravine, ici. Ce n'est pas un arrêt prévu.", r: ["{S} plonge la tête dans la ravine. Elle en ressort avec une feuille sur l'oreille, et un sourire qu'on ne lui connaissait pas.", "{S} remplit sa flasque, et elle y met une pastille. Bien sûr qu'elle a une pastille.", "{S} ne regarde pas la ravine. Ça coûterait 40 secondes, d'après elle."] },
    descente: { q: "1 200 mètres à perdre, beaucoup de marches. Je les ai comptées sur une vidéo. 2 340. Il en manque.", r: ["Attention, {s} descend les marches quatre à quatre ! Elle a arrêté de les compter !", "{S} descend marche par marche, comme une gramoun qui va au marché. C'est sûr, et c'est long.", "{S} descend à reculons. Elle a lu que c'était bon pour les genoux. On ne juge pas."] },
    didier: DIDIER_N, arche: ARCHE_N("La sono joue un séga. Il reste 300 mètres. Mon plan s'arrête là, je n'ai rien écrit pour la suite.")
  },
  u100: {
    foule: { q: "Tout le monde crie mon prénom. Ils le lisent sur le dossard. Je dois garder mon cardio sous 130. Ça ne m'aide pas.", r: ["{S} tape dans quelques mains, à peine. Elle compte ce que ça lui coûte, je pense.", "{S} part dans les cinquante premières, avec un cardio à 172. Elle regarde sa montre comme si c'était une trahison.", "{S} reste calme, à l'allure prévue. Pour le moment, le tableur gagne."] },
    silence: { q: "Plus de musique, plus personne. Mes trois montres sont d'accord entre elles. Ça me rassure, et je m'en inquiète.", r: ["{S} parle à la file indienne de son plan de nutrition. Quatre coureurs ont changé de position.", "{S} a mis un podcast sur l'endurance. Elle l'écoute en vitesse 1,5.", "{S} ne dit plus rien, et elle se concentre sur ses appuis. Rien à signaler."] },
    ravito1: { q: "3 h du matin, ravito au km 18. Prévu : 8 minutes. Je lance le chrono, et je n'ai aucune envie de manger.", r: ["{S} mange assise, avec un minuteur sur la table. Il a sonné, et elle a pris encore une cuillère.", "Soupe debout pour {s}, et elle souffle dessus exactement deux fois. Elle repart.", "{S} remplit sa flasque et ne reste pas une minute. Le plan disait 8, je le signale."] },
    sommeil: { q: "Mes yeux se ferment. J'ai prévu une micro-sieste au km 40. On est au km 21. Le sommeil n'a pas lu le fichier.", r: ["{S} se couche dans l'herbe, avec un réveil. Trois réveils, en fait. Ne l'écrasez pas.", "Un café pour {s}, mesuré. Elle ne dort plus, et elle a les yeux grands ouverts sur son plan.", "On entend des gifles dans la nuit. C'est {s}, toute seule. Elle a lu ça quelque part."] },
    montee: { q: "1 000 mètres à monter dans le noir. Des frontales au-dessus de moi, comme des étoiles. Je calcule leur vitesse.", r: ["Mais qu'est-ce qu'elle fait, {s} ? Elle court dans la montée, en pleine nuit ! Son plan pleure, si quelqu'un le connaît !", "{S} marche, régulière, à la vitesse prévue. On dirait un métronome, avec une frontale.", "{S} s'arrête à chaque lacet pour vérifier ses données. Il fait nuit, mais ses données sont très belles."] },
    lever: { q: "Le ciel devient orange. Je suis en haut, avec 12 minutes de retard. Je ne vais pas pleurer pour 12 minutes. Si.", r: ["{S} pleure au sommet. Elle dit que c'est le retard. Personne ne la croit, surtout pas elle.", "Selfie de {s} au lever du jour. Elle a les yeux de quelqu'un qui a refait ses calculs toute la nuit.", "{S} ne s'arrête pas. Elle a 12 minutes à rattraper, le soleil attendra."] },
    midi: { q: "Il fait trop chaud. Mes 450 ml par heure ne suffisent plus. Ça fait 12 h que je cours, et mon tableur n'a pas de colonne pour ça.", r: ["{S} est assise tout habillée dans la ravine. Elle a laissé ses montres sur le bord. Une image rare.", "{S} vide sa flasque d'un coup, sans la moindre mesure. On change d'époque.", "{S} avance de goyavier en goyavier. Elle en a mangé une, sans savoir combien de grammes."] },
    base1: { q: "Base de vie, mi-course. Lits de camp, pâtes, kiné. Arrêt prévu : 45 minutes, plan A. J'ai aussi un plan C.", r: ["{S} dort depuis une heure. Son tableur attendra. Un bénévole est chargé de la réveiller, avec une liste.", "Vingt minutes pour {s}, chrono en main, et des chaussettes pliées d'avance. Du grand art.", "{S} est sur la table de massage, et elle corrige la kiné sur le nom des muscles."] },
    descente: { q: "700 mètres à descendre. Mes genoux m'envoient des données que je ne veux pas lire.", r: ["Attention en bas, {s} arrive ! Elle a 66 km dans les jambes et plus aucun plan !", "{S} descend de côté. Un gramoun avec son pique-nique vient de la doubler. Elle a salué.", "{S} descend à reculons, comme le conseille un article. On lui souhaite bonne chance avec l'article."] },
    hallu: { q: "Deuxième nuit. Il y a un monsieur dans l'arbre, il me dit que je suis en retard. Je le sais. Mais comment il le sait ?", r: ["{S} explique son temps de passage à un arbre. L'arbre n'a pas l'air convaincu.", "Vingt minutes de sommeil pour {s}, dans sa couverture de survie. Elle l'avait pliée selon une méthode.", "{S} suit Patrick sans rien dire. Il ne sait pas où il va, mais pour une fois, elle s'en moque."] },
    chaise: { q: "Une chaise. Un monsieur qui rend son dossard, l'air heureux. J'ai un plan pour ça. C'est le plan \"ne pas regarder\".", r: [f => f.t > 30 ? "Une heure et demie que {s} est assise. Quelqu'un lui a mis un plaid. Elle a fermé son tableur. C'est grave." : "Quinze minutes de chaise, et {s} se relève, à la seconde près du minuteur. On peut l'applaudir.", "{S} mange debout, en regardant ailleurs. Le plan \"ne pas regarder\" fonctionne.", "« Lé pa loin », lui crie un bénévole. Elle lui répond qu'il reste 22 km et 340 mètres."] },
    dernier: { q: "Le dernier col. Je sais pas depuis quand je marche. Mes trois montres n'ont plus de batterie. Je suis libre, ou perdue.", r: ["On m'annonce {s} qui chante du maloya dans la montée. Faux, mais elle chante. Je n'y croyais pas.", "{S} appelle sa maman, et lui demande l'heure. Elle ne l'avait jamais demandée à personne.", "{S} serre les dents, sans chiffres. Elle monte, c'est tout ce qu'on lui demande."] },
    didier: DIDIER_N, arche: ARCHE_N("C'est l'arche. Toute la famille est là. J'ai quatre heures de retard sur le plan, et je m'en moque. Il reste 300 mètres.")
  },
  u165: {
    depart: { q: "Le stade est plein. J'ai répété ce moment dans ma tête, 40 fois, et je n'avais pas prévu les frissons.", r: ["{S} passe la ligne en filmant le public, et elle a coupé son chrono dans l'émotion. Elle s'en veut déjà.", "{S} se laisse emporter par la foule. Son cardio a l'air de vouloir porter plainte.", "{S} se range sur le côté et laisse passer. Elle a le sourire de quelqu'un qui a lu tous les livres."] },
    nuit1: { q: "Des heures de nuit, et j'en suis à un huitième de la course. Le tableau disait que ça passerait vite.", r: ["{S} dort sur un rocher, frontale éteinte pour économiser les piles. Évidemment.", "{S} prend un bonbon piment, et elle le regrette en temps réel. On l'a entendue depuis le ravito.", "{S} chante pour rester réveillée, en rythme avec sa foulée. Plusieurs coureurs ont accéléré."] },
    ravito1: { q: "Le jour se lève. Soupe, pâtes. Ma balance est restée dans le sac d'allègement, et ça me manque.", r: ["{S} prend son temps et mange tout ce que dit le plan. Elle a demandé si les pâtes étaient salées.", "Soupe et départ pour {s}, en moins de quatre minutes. Elle s'est brûlée, et elle l'a noté dans sa tête.", "{S} ne s'arrête que pour l'eau. Il reste 135 km, c'est dans le plan, paraît-il."] },
    montee: { q: "Le grand col. Six heures de montée d'après le roadbook. J'ai découpé ça en 72 tranches de 5 minutes.", r: ["Non mais regardez {s} ! Elle attaque au km 40 d'une course de 165 ! Quelqu'un a effacé son tableur ?", "{S} monte tranche par tranche, à son allure. Rien ne dépasse. Ça fait presque peur.", "{S} s'arrête à chaque lacet pour vérifier ses tranches. Elles ne tombent plus juste, et ça l'ennuie."] },
    chaleur: { q: "Plateau, plein soleil. L'indice UV n'était pas à ce niveau-là. Je parle à ma flasque, et je me réponds.", r: ["{S} fait la sieste sous un tamarin, avec un réveil. Le tamarin n'a pas d'avis.", "{S} vide sa flasque d'une traite. Elle ne sait pas combien elle a bu. Elle tremble un peu.", "Casquette mouillée pour {s}. Elle a calculé que ça durait quatre minutes, et elle a raison."] },
    ampoules: { q: "Pieds. J'ai tout prévu : deux paires de rechange, de la crème, du strap. Mes pieds n'ont rien voulu savoir.", r: ["{S} est chez les podologues, et elle leur montre sa routine. Ils sont très polis.", "Changement de chaussettes pour {s}, dans l'ordre prévu. Les anciennes vont dans un sachet étiqueté.", "{S} ne regarde pas ses pieds. C'est la première donnée qu'elle refuse de lire."] },
    base: { q: "Mi-course. Une dame gentille me propose de me faire ramener. Ce n'est dans aucun de mes sept plans B.", r: ["{S} dort deux heures, comme écrit dans le plan. Elle a même prévenu les bénévoles de l'heure exacte.", "Vingt minutes de sommeil pour {s}. Elle s'est réveillée en récitant ses temps de passage.", "{S} remercie la dame et repart. La dame a regardé son tableur en papier, inquiète."] },
    nuit2: { q: "Un chien me suit. Il dit que mon allure moyenne est mauvaise. Il a raison. Je crois que le chien n'existe pas.", r: ["{S} débat de son allure avec un chien imaginaire. Le chien a de bons arguments.", "Dix minutes par terre pour {s}, dans sa couverture de survie. Ça brille, et c'est très bien plié.", "{S} rejoint un groupe. Personne ne se parle, et elle a cessé de leur donner des conseils."] },
    jour3: { q: "Deuxième matin. Je pleure, et je n'ai aucune colonne pour ça. Mon plan est mort cette nuit. Je crois que ça me fait du bien.", r: ["{S} regarde le soleil se lever, les joues mouillées et les montres dans le sac. Je vais me taire.", "{S} appelle chez elle à 6 h du matin. Elle laisse un message très détaillé, puis un second pour corriger.", "{S} ne lève pas le nez et recalcule. Elle n'est pas encore prête à arrêter."] },
    descente: { q: "Deux heures de descente. Mes cuisses sont en verre. Mes statistiques sont en miettes.", r: ["Mais {s} court encore en descente au km 128 ! Il n'y a que des cabris pour la voir, et ils sont surpris.", "{S} descend de profil, depuis une heure. Elle a un côté plus usé que l'autre, et elle le sait.", "{S} passe le raide à quatre pattes. C'est la technique la moins élégante de sa vie, et la plus efficace."] },
    chaise: { q: "Une chaise au soleil. Un monsieur rend son dossard en riant. Il reste 27 km. Lé pa loin, qu'ils disent. J'ai vérifié, si.", r: [f => f.t > 30 ? "Deux heures que {s} est assise. On lui a fait deux cafés. Elle raconte à la chaise ce qu'était son plan." : "Vingt minutes de chaise, et {s} se relève en trois essais. Elle ne les a pas notés.", "{S} vide le plateau de gâteau patate, debout, sans compter. Sans compter ! Vous entendez ?", "{S} passe sans s'arrêter et salue la chaise. C'est personnel, entre elles."] },
    nuit3: { q: "Encore la nuit. Je ne sais plus quel jour on est, et je n'ai plus de batterie pour le vérifier. Quelqu'un me dit bravo.", r: ["{S} a retrouvé Patrick. Ou un autre Patrick. Ils avancent ensemble, et elle ne lui donne plus aucun conseil.", "{S} dort debout contre un filao, cinq minutes. Ça ne s'apprend pas, même avec un tableur.", "{S} compte à voix haute. Elle en est à 12, pour la quatrième fois, et ça la rend furieuse."] },
    didier: DIDIER_N, arche: ARCHE_N("C'est le stade. Je le reconnais. J'avais prévu 38 heures. Ça n'a plus aucune importance. Il reste 300 mètres.")
  },
  u230: {
    depart: { q: "230 km. Mon tableur a 31 onglets pour cette course, et il plante au chargement. C'est peut-être un signe.", r: ["{S} part au pas, comme le dit l'onglet 1. Pour une fois, tout le monde pense qu'elle a raison.", "{S} part en courant. L'onglet 1 n'est pas d'accord, et ses montres non plus.", "{S} vient de demander si le 10 km existait encore. La réponse est non. Elle a noté."] },
    nuit1: { q: "Minuit passé. J'ai fait un neuvième. J'adore les fractions, en temps normal.", r: ["{S} déroule son duvet de 180 g et dort vingt minutes. Elle a chronométré le pliage.", "{S} a mis une liste de lecture de 48 heures, classée par cardio. On l'entend à trente mètres.", "{S} refait son plan à voix haute. Elle en est à la version 12."] },
    montee: { q: "Une montée qui ne finit pas, et il y en a dix autres. Mes genoux demandent une révision du planning.", r: ["{S} attaque au km 35 d'une course de 230 ! Je répète : 230 ! Quelqu'un peut appeler son tableur ?", "{S} monte à l'allure d'une gramoun qui va au champ. C'est écrit dans l'onglet 7, et c'est très juste.", "{S} s'arrête pour vérifier ses chiffres. Il n'y a que des chiffres, à cette altitude."] },
    matin1: { q: "Le jour se lève. Je suis dans les temps. Il reste deux jours comme celui-là. Je suis moins dans les temps.", r: ["Petit-déjeuner complet pour {s}, pesé à l'œil. Elle a fait la paix avec son œil.", "{S} mange sa banane en marchant, à la minute prévue. On pourrait en faire une horloge.", "{S} envoie une photo à son beau-frère, avec sa moyenne en légende. C'est méchant.", ] },
    chaleur: { q: "Chaleur de four. J'ai une ampoule à un endroit que je n'avais pas protégé. C'est le seul.", r: ["{S} se met à l'abri sous un tamarin. Une chèvre mange le coin de son plan papier. Elle la laisse faire.", "{S} finit son eau. Il reste 8 km jusqu'à la suivante, et elle l'a calculé trois fois sans changer le résultat.", "{S} soigne son ampoule avec sa trousse, classée par couleur. Les âmes sensibles peuvent regarder ailleurs."] },
    base1: { q: "Première base de vie. Arrêt prévu : 1 h 15. Il y a un gars qui rend son dossard en dansant. Il n'a pas de plan, lui.", r: ["Trois heures de sommeil pour {s}. Elle en avait prévu 1 h 15. Personne n'a osé la réveiller.", "Sieste de trente minutes pour {s}. Elle s'est réveillée en disant « onglet 14 ».", "{S} repart avec ses pâtes dans une boîte étiquetée. Une vraie professionnelle."] },
    nuit2: { q: "3 h du matin. Un mouton me double. Il n'y a pas de moutons ici. Il va à 5:50. Il tient très bien son allure.", r: ["{S} félicite un rocher pour son allure. Il est très régulier, il faut le reconnaître.", "Quinze minutes dans une couverture de survie pour {s}. Elle a réglé deux réveils, et n'en entend aucun.", "Un café très fort pour {s}. Elle a maintenant les yeux grands ouverts sur rien du tout."] },
    matin2: { q: "Plus de batterie sur la montre n°2. Plus de genou gauche. Il reste 100 km, soit 43 % du parcours. Ça ne m'aide pas de le savoir.", r: ["{S} chez le kiné. Elle lui donne ses données, et il lui demande où elle a mal. Elle ne sait plus.", "{S} prend des bâtons, et elle les règle au centimètre. Quatre appuis, et ça repart.", "{S} serre ses lacets au cran prévu. C'est la dernière chose qui obéit au plan."] },
    moral: { q: "Je pleure. Il y a une chaussette par terre. Elle n'était pas dans le plan non plus. Elle est toute seule.", r: ["{S} pleure sur un caillou, sans minuteur. Laissez-la, c'est sa première pause non prévue.", "{S} appelle sa maman, et lui dit qu'elle a tout bien fait. Sa maman lui demande si elle a mangé.", "{S} ramasse la chaussette et la range dans son sac, dans la bonne poche."] },
    base2: { q: "Deuxième base de vie. Une dame me dit que je suis une héroïne. Je cherche mon tableur. Je ne me souviens plus du mot de passe.", r: ["Quatre heures de sommeil pour {s}. Elle s'est réveillée deux fois, en croyant que c'était fini.", "Vêtements propres et repas chaud pour {s}. Elle ressemble presque à sa photo de profil.", "{S} repart aussitôt, de peur de ne plus repartir. C'est le seul plan qu'il lui reste."] },
    nuit3: { q: "Troisième nuit. Patrick me parle de son genou, et je lui propose un plan. Patrick est un arbre. Bonsoir Patrick.", r: ["{S} établit un plan d'entraînement pour un filao. Il l'a très bien pris.", "Deux minutes de sommeil debout pour {s}. Elle s'est réveillée en marchant, et dans le bon sens.", "{S} s'enfuit en courant devant un arbre. Il n'avait rien fait, à ma connaissance."] },
    chaise: { q: "Une chaise avec des accoudoirs. Il reste 22 km. Je n'ai plus de plan. Je n'ai plus que cette chaise.", r: [f => f.t > 30 ? "Trois heures que {s} est sur sa chaise. Elle l'a ajoutée à son plan, pour la prochaine fois." : "Vingt minutes de chaise, et {s} se relève ! Elle l'a remerciée en partant, je l'ai entendu.", "{S} mange debout, en regardant ailleurs. C'est la plus belle chose que j'aie vue sur cette course.", "{S} s'éloigne en se retenant de se retourner. Ça ne tient qu'à un fil."] },
    descente: { q: "Dernière descente. Mes genoux ont quitté le groupe au km 130. Je continue sans eux, ils ont été prévenus.", r: ["{S} court en descente au km 218 ! Ce n'est plus du courage. On ne sait plus ce que c'est.", "{S} finit la descente à reculons. Elle voit d'où elle vient, c'est déjà beaucoup.", "{S} descend assise sur le raide. Ce n'est interdit nulle part, j'ai vérifié, et elle aussi."] },
    didier: DIDIER_N, arche: ARCHE_N("L'arche. Ça fait trois jours. J'avais un plan, je crois. Il reste 300 mètres, et je n'ai plus de montre.")
  }
});
const fem = t => t && t.replace(/\bIl\b/g, 'Elle').replace(/\bil\b/g, 'elle');
Object.assign(DELAYED, {
  plat: () => ({ noFragile: 1, title: 'Le plat de Didier', q: "Ça fait dix minutes que c'est plat. Plat comme Didier l'entend. J'ai les mollets en feu.", ch: [
    ch("J'envoie un vocal à Didier", { r: "Le dossard {d} envoie un message vocal en montant. Je n'ai pas tout compris. Il y a le mot « plat », et d'autres mots.", t: .6, m: 10, msg: ['Didier', "Bah quoi, c'est plat pour moi"] }),
    ch("Je garde ma colère pour la montée", { r: "Le dossard {d} ne dit plus rien. Il regarde la pente comme si elle lui devait de l'argent.", j: -5, m: 5, t: -.4 }),
    ch("Je marche, par principe", { r: "Le dossard {d} se met à marcher. C'est plat, paraît-il, alors il fait une pause.", t: 1, j: 5, m: -3 }) ] }),
  pari: () => ({ noFragile: 1, title: 'Le pari', q: "Km 9. Si Didier me bat, c'est moi qui paie les samoussas. Il les veut au fromage.", ch: [
    ch("Je finis à fond", { r: "Le dossard {d} accélère à un kilomètre de l'arrivée. On me dit qu'il y a des samoussas en jeu, tout s'explique.", t: -1.2, j: -9, e: -6, m: 6 }),
    ch("Je paierai, tant pis", { r: "Le dossard {d} ne se bat plus. Il fait ses comptes, 100 samoussas, ça chiffre.", m: -6, e: 3 }),
    ch("Je propose quitte ou double", { r: "Le dossard {d} envoie un message en courant. C'est quitte ou double, on ne sait plus combien de samoussas.", m: 8, t: .4, j: -3, msg: ['Didier', "Tope là. Avec le piment"] }) ] }),
  bouchon: () => ({ noFragile: 1, title: 'Le bouchon', q: "Y a un bouchon. À 4 h 30 du matin. Tout le monde a eu la même idée que moi, et ils ont déjà donné le départ.", ch: [
    ch("Je me gare n'importe où et je cours", { r: "Le dossard {d} arrive en courant, portière encore ouverte d'après ce qu'on me dit. Bienvenue quand même.", t: 3, e: -5, m: 3 }),
    ch("Je cherche une vraie place", { r: "On attend encore le dossard {d}. Il a trouvé une place, à deux kilomètres. Il arrive.", t: 6, j: 3, m: -6 }),
    ch("Je confie mes clés à un inconnu", { r: "Le dossard {d} a donné ses clés à un monsieur en tongs. Il part tranquille. On ne sait pas pour la voiture.", t: 2, m: -3 }) ] }),
  cou: () => ({ noFragile: 1, title: 'Le cou', q: "Mon cou est resté sur le parking. Depuis ce matin, je vois tout le trail à gauche.", ch: [
    ch("Je tourne tout le corps", { r: "Le dossard {d} se retourne en entier pour regarder derrière lui. On dirait un frigo qu'on déplace.", t: .8, j: -3, m: 4 }),
    ch("Je demande un massage", { r: "Le dossard {d} s'est fait masser le cou par un bénévole. Il dit qu'il voit à droite. On est contents pour lui.", t: 2.5, j: 6, m: 5 }),
    ch("Je fais avec", { r: "Le dossard {d} continue la tête penchée. Les photographes, c'est pour vous.", m: -7, j: -2 }) ] }),
  biere: () => ({ noFragile: 1, title: 'La bière', q: "Km 38. Je pense à ma bière depuis le km 20. Elle m'attend. Elle, au moins.", ch: [
