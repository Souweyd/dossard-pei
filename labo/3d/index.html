<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Vue 3D – essai</title>
<link rel="stylesheet" href="maplibre-gl.css">
<style>
:root{--ink:#1d2523;--hot:#ff5a1f}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#083b5a;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
#map{position:absolute;inset:0}
header{position:absolute;left:0;right:0;top:0;z-index:3;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:linear-gradient(rgba(10,20,25,.75),rgba(10,20,25,0));color:#fff}
header b{flex:1;min-width:0;font-size:17px;line-height:1.15}
header small{display:block;font-weight:600;font-size:12px;opacity:.85}
select{font:600 13px system-ui;border:0;border-radius:999px;padding:7px 12px;background:#fff;color:var(--ink)}
.hud{position:absolute;left:16px;right:16px;top:calc(84px + env(safe-area-inset-top));z-index:3;display:flex;justify-content:space-between;align-items:flex-start;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6);pointer-events:none}
.hud .big{font-weight:800;font-size:44px;line-height:.95}.hud .big i{font-style:normal;font-size:.43em;margin-left:3px}
.hud .row{font-weight:700;font-size:14px;margin-top:4px}.hud .row b{color:#ffb08f}
.hud .rest{text-align:right;font-weight:700;font-size:13px}.hud .rest span{display:block;font-weight:800;font-size:24px;line-height:1.05}
.pl{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:3;display:flex;align-items:center;gap:10px;background:rgba(17,17,19,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:16px;padding:8px 12px 8px 8px;color:#fff}
.play{width:44px;height:44px;flex:none;border-radius:50%;border:0;background:#fff;display:grid;place-items:center;cursor:pointer}
.play svg{width:18px;height:18px;fill:#111113}
.pr{position:relative;flex:1;min-width:0;height:44px}
.pr svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pr .pdot{position:absolute;left:0;top:95%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--hot);border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.pr input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.km{font-weight:700;font-size:12px;text-align:right;line-height:1.2;white-space:nowrap}.km small{display:block;opacity:.7;font-weight:600}
.runner{width:30px;height:42px;background-size:contain;background-repeat:no-repeat;pointer-events:none}
.dotm{width:20px;height:20px;border-radius:50%;border:4px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.5)}
.maplibregl-ctrl-attrib{font-size:10px}
.maplibregl-ctrl-bottom-right{bottom:72px}
</style></head><body>
<div id="map"></div>
<header><b id="ttl">…<small id="sub">Vue 3D · photo et relief IGN</small></b><select id="trk" hidden></select></header>
<div class="hud"><div><div class="big"><span id="vkm">0</span><i>km</i></div><div class="row"><b id="vdp">+0 m</b> · alt. <span id="valt">0</span> m</div></div>
<div class="rest">reste<span id="vrest">0 km</span></div></div>
<div class="pl"><button class="play" id="play" aria-label="Lancer le survol"><svg viewBox="0 0 24 24"><path id="pp" d="M8 5v14l11-7z"/></svg></button>
<div class="pr"><svg viewBox="0 0 600 40" preserveAspectRatio="none"><defs><clipPath id="clip"><rect x="0" y="0" width="0" height="40"/></clipPath></defs>
<polygon id="pbg" fill="rgba(255,255,255,.18)"/><polygon id="pdone" fill="#ff5a1f" opacity=".9" clip-path="url(#clip)"/><polyline id="pln" fill="none" stroke="#fff" stroke-width="1.4" opacity=".9" vector-effect="non-scaling-stroke"/></svg>
<span class="pdot" id="pdot"></span><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Avancée du survol"></div>
<div class="km" id="kmt"></div></div>
<script src="maplibre-gl.js"></script>
<script>
// ---------- relief: IGN « RGE ALTI » (1 m) asked tile by tile in Web Mercator, turned into Terrarium tiles for MapLibre
const WMS = 'https://data.geopf.fr/wms-r?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetMap&STYLES=&CRS=EPSG:3857&WIDTH=256&HEIGHT=256';
const ORTHO = 'https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=ORTHOIMAGERY.ORTHOPHOTOS&STYLE=normal&TILEMATRIXSET=PM&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&FORMAT=image/jpeg';
const E = 20037508.342789244;
maplibregl.addProtocol('ignalt', async (p, ab) => {
  const [z, x, y] = p.url.split('://')[1].split('/').map(Number), s = 2 * E / 2 ** z;
  const bb = [-E + x * s, E - (y + 1) * s, -E + (x + 1) * s, E - y * s].map(v => v.toFixed(2)).join(',');
  const r = await fetch(`${WMS}&LAYERS=ELEVATION.ELEVATIONGRIDCOVERAGE.HIGHRES&BBOX=${bb}&FORMAT=${encodeURIComponent('image/x-bil;bits=32')}`, {signal: ab.signal});
  const f = new Float32Array(await r.arrayBuffer()), cv = new OffscreenCanvas(256, 256), cx = cv.getContext('2d'), im = cx.createImageData(256, 256), d = im.data;
  for (let i = 0; i < f.length; i++) { let v = f[i] > -500 ? f[i] : -10; v += 32768; d[4 * i] = v >> 8 & 255; d[4 * i + 1] = Math.floor(v) & 255; d[4 * i + 2] = Math.floor((v % 1) * 256); d[4 * i + 3] = 255; }
  cx.putImageData(im, 0, 0);
  return {data: await (await cv.convertToBlob({type: 'image/png'})).arrayBuffer()};
});
const BOUNDS = [55.18, -21.42, 55.86, -20.84];
const map = new maplibregl.Map({container: 'map', attributionControl: {compact: true}, maxPitch: 78, pitch: 55, zoom: 11, center: [55.45, -21.1], preserveDrawingBuffer: /rec/.test(location.search),
  style: {version: 8,
    sources: {ign: {type: 'raster', tiles: [ORTHO], tileSize: 256, maxzoom: 19, attribution: 'Photo et relief © IGN'},
      dem: {type: 'raster-dem', tiles: ['ignalt://{z}/{x}/{y}'], tileSize: 256, encoding: 'terrarium', minzoom: 9, maxzoom: 15, bounds: BOUNDS},
      hs: {type: 'raster-dem', tiles: ['ignalt://{z}/{x}/{y}'], tileSize: 256, encoding: 'terrarium', minzoom: 9, maxzoom: 14, bounds: BOUNDS}},
    layers: [{id: 'ign', type: 'raster', source: 'ign', paint: {'raster-saturation': .1, 'raster-contrast': .06}},
      {id: 'hs', type: 'hillshade', source: 'hs', paint: {'hillshade-exaggeration': .18, 'hillshade-shadow-color': '#14302c', 'hillshade-highlight-color': '#fff6e0', 'hillshade-accent-color': '#14302c'}}],
    terrain: {source: 'dem', exaggeration: 1},
    sky: {'sky-color': '#6fb0e6', 'horizon-color': '#e6f0f5', 'fog-color': '#dbe7ee', 'sky-horizon-blend': .5, 'horizon-fog-blend': .6, 'fog-ground-blend': .7, 'atmosphere-blend': .9}}});
map.addControl(new maplibregl.NavigationControl({visualizePitch: true}), 'bottom-right');

// ---------- little runner with his bib « 974 » (same drawing as the site's 3D view), two frames
function runFrame(f) {
  const c = document.createElement('canvas'); c.width = 100; c.height = 140; const x = c.getContext('2d'); x.lineCap = x.lineJoin = 'round'; x.translate(50, 128);
  const legs = f ? [[[-2, -46], [-14, -24], [-8, 0]], [[-2, -46], [12, -26], [26, -30]]] : [[[-2, -46], [-18, -30], [-28, -10]], [[-2, -46], [8, -22], [6, 0]]];
  const arms = f ? [[[2, -80], [-12, -66], [-22, -72]], [[2, -80], [16, -64], [26, -56]]] : [[[2, -80], [16, -70], [24, -78]], [[2, -80], [-10, -62], [-18, -54]]];
  const path = (pts, w, col) => { x.strokeStyle = col; x.lineWidth = w; x.beginPath(); pts.forEach(([a, b], i) => i ? x.lineTo(a, b) : x.moveTo(a, b)); x.stroke(); };
  const fig = col => { legs.forEach(l => path(l, col === '#fff' ? 17 : 10, col)); arms.forEach(l => path(l, col === '#fff' ? 14 : 7, col)); path([[2, -82], [-2, -46]], col === '#fff' ? 22 : 15, col);
    x.fillStyle = col; x.beginPath(); x.arc(5, -98, col === '#fff' ? 14 : 10, 0, 7); x.fill(); };
  fig('#fff'); fig('#1d2523');
  x.fillStyle = '#fff'; x.fillRect(-9, -76, 20, 15); x.fillStyle = '#1d4f9c'; x.fillRect(-9, -76, 20, 4); x.fillStyle = '#1d2523'; x.font = '700 9px sans-serif'; x.textAlign = 'center'; x.fillText('974', 1, -63);
  return c.toDataURL();
}
const RUN = [runFrame(0), runFrame(1)];
const runEl = document.createElement('div'); runEl.className = 'runner'; runEl.style.backgroundImage = `url(${RUN[0]})`;
const runner = new maplibregl.Marker({element: runEl, anchor: 'bottom'});
const dotEl = c => { const e = document.createElement('div'); e.className = 'dotm'; e.style.background = c; return e; };

// ---------- geometry helpers
const RAD = Math.PI / 180, RE = 6371e3;
const dist = (a, b) => { const dl = (b[0] - a[0]) * RAD, dn = (b[1] - a[1]) * RAD, h = Math.sin(dl / 2) ** 2 + Math.cos(a[0] * RAD) * Math.cos(b[0] * RAD) * Math.sin(dn / 2) ** 2; return 2 * RE * Math.asin(Math.sqrt(h)); };
const bear = (a, b) => { const y = Math.sin((b[1] - a[1]) * RAD) * Math.cos(b[0] * RAD), x = Math.cos(a[0] * RAD) * Math.sin(b[0] * RAD) - Math.sin(a[0] * RAD) * Math.cos(b[0] * RAD) * Math.cos((b[1] - a[1]) * RAD); return Math.atan2(y, x) / RAD; };
const adiff = (a, b) => ((b - a + 540) % 360) - 180;
let T, cum, L, gain, zs, KM, DP, marks = [];
const at = d => { d = Math.max(0, Math.min(L, d)); let lo = 0, hi = cum.length - 1; while (hi - lo > 1) { const m = (lo + hi) >> 1; cum[m] <= d ? lo = m : hi = m; }
  const f = (d - cum[lo]) / ((cum[hi] - cum[lo]) || 1), a = T.pts[lo], b = T.pts[hi]; return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f, lo]; };
// heading the camera looks at: direction of the next 1.2 km seen from 300 m behind (no jerk in hairpins)
const aim = d => { const a = at(d - 300), b = at(d + 1200); return bear(a, b); };
const f1 = v => v.toFixed(1).replace('.', ','), nf = v => Math.round(v).toLocaleString('fr-FR');

function setTrack(t) {
  T = t; KM = t.km; DP = t.dp; cum = [0];
  for (let i = 1; i < t.pts.length; i++) cum.push(cum[i - 1] + dist(t.pts[i - 1], t.pts[i]));
  const k = KM * 1000 / cum.at(-1); for (let i = 0; i < cum.length; i++) cum[i] *= k; L = cum.at(-1);
  zs = t.pts.map(p => p[2]); gain = [0]; { let ref = zs[0], s = 0; for (let i = 1; i < zs.length; i++) { if (zs[i] > ref + 5) { s += zs[i] - ref; ref = zs[i]; } else if (zs[i] < ref - 5) ref = zs[i]; gain.push(s); } }
  if (DP && gain.at(-1) > 0) { const f = DP / gain.at(-1); for (let i = 0; i < gain.length; i++) gain[i] *= f; }
  const coords = t.pts.map(p => [p[1], p[0]]), fc = {type: 'Feature', geometry: {type: 'LineString', coordinates: coords}};
  if (map.getSource('route')) { map.getSource('route').setData(fc); map.getSource('done').setData({type: 'FeatureCollection', features: []}); }
  else { map.addSource('route', {type: 'geojson', data: fc}); map.addSource('done', {type: 'geojson', data: {type: 'FeatureCollection', features: []}});
    map.addLayer({id: 'case', type: 'line', source: 'route', paint: {'line-color': '#fff', 'line-width': ['interpolate', ['linear'], ['zoom'], 10, 4, 15, 9]}, layout: {'line-join': 'round', 'line-cap': 'round'}});
    map.addLayer({id: 'line', type: 'line', source: 'route', paint: {'line-color': '#ffb08f', 'line-width': ['interpolate', ['linear'], ['zoom'], 10, 2.2, 15, 5]}, layout: {'line-join': 'round', 'line-cap': 'round'}});
    map.addLayer({id: 'rest', type: 'line', source: 'done', paint: {'line-color': '#ff5a1f', 'line-width': ['interpolate', ['linear'], ['zoom'], 10, 2.2, 15, 5]}, layout: {'line-join': 'round', 'line-cap': 'round'}}); }
  marks.forEach(m => m.remove());
  marks = [new maplibregl.Marker({element: dotEl('#1b7f3b')}).setLngLat(coords[0]).addTo(map), new maplibregl.Marker({element: dotEl('#1d2523')}).setLngLat(coords.at(-1)).addTo(map)];
  // profile bar
  const zT = Math.max(...zs), zB = Math.min(...zs), pY = z => 38 - (z - zB) / Math.max(1, zT - zB) * 34;
  const pp = zs.map((z, i) => `${(cum[i] / L * 600).toFixed(1)} ${pY(z).toFixed(1)}`).join(' ');
  document.getElementById('pbg').setAttribute('points', `0 40 ${pp} 600 40`); document.getElementById('pdone').setAttribute('points', `0 40 ${pp} 600 40`); document.getElementById('pln').setAttribute('points', pp);
  document.getElementById('kmt').innerHTML = `${f1(KM)} km<small>${nf(zT)} m max</small>`;
  T.pY = pY; hud(0); runner.remove();
  home(0);
}
function hud(d) { const [, , z, i] = at(d), x = d / L * 600;
  document.getElementById('vkm').textContent = f1(d / 1000); document.getElementById('vdp').textContent = `+${nf(gain[i])} m`; document.getElementById('valt').textContent = nf(z);
  document.getElementById('vrest').textContent = `${f1((L - d) / 1000)} km`;
  document.querySelector('#clip rect').setAttribute('width', x); const pd = document.getElementById('pdot'); pd.style.left = (x / 6) + '%'; pd.style.top = (T.pY(z) / .4) + '%';
  document.getElementById('seek').value = Math.round(d / L * 1000); }
function home(dur) { const b = new maplibregl.LngLatBounds(); T.pts.forEach(p => b.extend([p[1], p[0]]));
  map.fitBounds(b, {padding: {top: 150, bottom: 110, left: 30, right: 30}, pitch: 50, bearing: aim(L * .5) * 0 - 10, duration: dur}); }

// ---------- flyover: the runner moves at a steady pace, the camera follows behind him with a smoothed heading
const FLY = {d: 0, h: 0, on: false, last: 0};
const speed = () => L / Math.min(75, Math.max(30, KM * 1.1));       // metres per second of video (30 to 75 s for the whole race)
function place(d, dt) {
  const p = at(d); FLY.h += adiff(FLY.h, aim(d)) * Math.min(1, dt * 1.6);     // the heading catches up slowly
  map.jumpTo({center: [p[1], p[0]], bearing: FLY.h, pitch: 64, zoom: 14.1});
  runner.setLngLat([p[1], p[0]]).addTo(map); runEl.style.backgroundImage = `url(${RUN[Math.floor(d / 14) % 2]})`;
  const done = T.pts.slice(0, p[3] + 1).map(q => [q[1], q[0]]).concat([[p[1], p[0]]]);
  map.getSource('done').setData({type: 'Feature', geometry: {type: 'LineString', coordinates: done}});
  hud(d);
}
const setPlay = on => { document.getElementById('pp').setAttribute('d', on ? 'M7 5h4v14H7zM13 5h4v14h-4z' : 'M8 5v14l11-7z'); };
function loop(now) { if (!FLY.on) return; const dt = Math.min(.1, (now - FLY.last) / 1000); FLY.last = now;
  FLY.d = Math.min(L, FLY.d + speed() * dt); place(FLY.d, dt);
  if (FLY.d >= L) { FLY.on = false; setPlay(false); setTimeout(() => home(2500), 800); return; } requestAnimationFrame(loop); }
function start() { if (FLY.d >= L) FLY.d = 0; FLY.h = aim(FLY.d); const p = at(FLY.d);
  map.flyTo({center: [p[1], p[0]], bearing: FLY.h, pitch: 64, zoom: 14.1, duration: FLY.d ? 600 : 2500, essential: true});
  map.once('moveend', () => { FLY.on = true; FLY.last = performance.now(); setPlay(true); requestAnimationFrame(loop); }); }
document.getElementById('play').onclick = () => { if (FLY.on) { FLY.on = false; setPlay(false); } else start(); };
document.getElementById('seek').oninput = e => { FLY.on = false; setPlay(false); FLY.d = e.target.value / 1000 * L; FLY.h = aim(FLY.d); place(FLY.d, 1); };
map.on('dragstart', () => { if (FLY.on) { FLY.on = false; setPlay(false); } });
// recording (deterministic): window.rec(t) shows the state t seconds after the start of the flyover
window.rec = t => { if (t === 0) { FLY.d = 0; FLY.h = aim(0); } FLY.d = Math.min(L, t * speed()); place(FLY.d, 1 / 25); };

// ---------- data
map.on('load', async () => {
  const id = new URLSearchParams(location.search).get('id') || 'mafate-trail-tour-2026-11';
  const [data, g] = await Promise.all([fetch('../../data.json').then(r => r.json()), fetch(`../../gpx/${id}.json`).then(r => r.json())]);
  const race = data.races.find(r => r.id === id) || {nom: id};
  document.getElementById('ttl').firstChild.textContent = race.nom;
  const meta = (data.gpx[id] || {}).tracks || g.tracks;
  const sel = document.getElementById('trk');
  g.tracks.forEach((t, i) => { t.km = (meta[i] || t).km || t.km; t.dp = (meta[i] || t).dp || t.dp; const o = document.createElement('option'); o.value = i; o.textContent = `${t.nom} · ${f1(t.km)} km`; sel.appendChild(o); });
  if (g.tracks.length > 1) sel.hidden = false;
  const want = +(new URLSearchParams(location.search).get('t') || 0);
  sel.value = want; sel.onchange = () => { FLY.on = false; FLY.d = 0; setPlay(false); setTrack(g.tracks[sel.value]); };
  setTrack(g.tracks[want]);
  window.ready = true;
});
</script></body></html>
