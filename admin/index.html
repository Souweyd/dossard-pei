<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Admin · Dossard Péi</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--teal:#00968f;--teal-d:#007a74;--ink:#15201f;--ink2:#4b5a58;--mut:#7d8b89;--bg:#f4f7f6;--card:#fff;--line:#dfe6e4;--soft:#e6f4f3;--warn:#b25e00;--warn-bg:#fff3e2;--bad:#c0392b;--bad-bg:#fdecea;--ok:#1e8a4c;--ok-bg:#e7f6ee;--chip:#eef2f1;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e8efee;--ink2:#b5c3c1;--mut:#8a9997;--bg:#0f1716;--card:#18211f;--line:#2b3735;--soft:#123432;--warn:#f0a24a;--warn-bg:#3a2a12;--bad:#f07a6c;--bad-bg:#3b1d1a;--ok:#5fd193;--ok-bg:#15301f;--chip:#22302e;--teal:#22b5ad;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--teal)}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:var(--teal);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
.top b{font-size:17px;white-space:nowrap}.top .tag{background:rgba(255,255,255,.2);border-radius:99px;padding:1px 9px;font-size:12px;font-weight:600}
.top .sp{flex:1}.top a{color:#fff;font-size:13px;text-decoration:none;opacity:.9;white-space:nowrap}
@media(max-width:600px){#who{display:none}}
#who{font-size:12px;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:34vw}
.tabs{position:sticky;top:46px;z-index:19;display:flex;gap:4px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--line);padding:6px 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:8px 12px;border-radius:9px;font-weight:600;color:var(--ink2);white-space:nowrap;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--soft);color:var(--teal)}
main{max-width:1060px;margin:0 auto;padding:14px 16px 90px}
h2{font-size:20px;margin:6px 0 12px}h3{font-size:15px;margin:18px 0 8px;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.search{flex:1 1 220px;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 11px;font-size:13px;white-space:nowrap;cursor:pointer}
.chip[aria-pressed=true]{background:var(--teal);border-color:var(--teal);color:#fff}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;background:var(--chip);white-space:nowrap}
.btn.p{background:var(--teal);color:#fff}.btn.d{background:var(--bad-bg);color:var(--bad)}.btn.s{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.list{display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:11px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 11px;cursor:pointer;text-align:left;width:100%}
.row:hover{border-color:var(--teal)}
.row img,.row .ph{width:44px;height:44px;border-radius:8px;object-fit:cover;flex:none;background:var(--chip)}
.row .t{flex:1;min-width:0;display:block}.row .n,.row .m{display:block}.row .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m{font-size:13px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bd{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:1px;background:var(--chip);color:var(--ink2)}
.bd.a{background:var(--bad-bg);color:var(--bad)}.bd.c{background:var(--warn-bg);color:var(--warn)}.bd.h{background:var(--chip);color:var(--mut)}.bd.l{background:var(--soft);color:var(--teal)}.bd.ok{background:var(--ok-bg);color:var(--ok)}
.empty{color:var(--mut);padding:24px;text-align:center}
.note{font-size:13px;color:var(--ink2);background:var(--soft);border-radius:10px;padding:9px 12px;margin:8px 0}
.note.w{background:var(--warn-bg);color:var(--warn)}
/* éditeur */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet[hidden]{display:none}
.shead{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
.shead .ti{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbody{max-width:860px;margin:0 auto;padding:6px 16px 120px}
.sfoot{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;gap:8px;justify-content:flex-end;align-items:center;background:var(--card);border-top:1px solid var(--line);padding:10px 16px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.sfoot .ch{flex:1;font-size:13px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px 14px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}.f.w{grid-column:1/-1}
.f>label,.lab{font-size:12.5px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:6px}
.f input:not([type=checkbox]):not([type=radio]),.f select,.f textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
.f textarea{min-height:76px;resize:vertical}
.f.chg input,.f.chg select,.f.chg textarea{border-color:var(--teal);box-shadow:0 0 0 2px var(--soft)}
.ck{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;padding:4px 0}
.ck input{width:18px;height:18px;accent-color:var(--teal)}
.lk{border:0;background:none;padding:0 2px;cursor:pointer;font-size:12px;color:var(--teal);font-weight:600}
.lk.on::before{content:"🔒 ";}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{border:1px solid var(--line);border-radius:10px;padding:8px 11px;cursor:pointer;font-size:14px;background:var(--bg)}
.seg input{display:none}.seg label:has(input:checked){border-color:var(--teal);background:var(--soft);color:var(--teal);font-weight:600}
.ep{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--bg)}
.ep .eh{display:flex;align-items:center;gap:6px;margin-bottom:8px}.ep .eh b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ep .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.mini{height:230px;border-radius:10px;border:1px solid var(--line);margin-top:6px}
.poster{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.poster img{width:130px;border-radius:10px;border:1px solid var(--line);background:var(--chip)}
details.adv summary{cursor:pointer;font-weight:600;color:var(--ink2);padding:6px 0}
textarea.code{font:12px/1.4 ui-monospace,Menlo,monospace;min-height:260px;width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
.pair{display:flex;gap:6px;margin:4px 0}.pair input,.pair select{flex:1;min-width:0;padding:8px 9px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
.pair select{flex:0 0 auto;width:auto}
.x{border:0;background:var(--chip);border-radius:8px;width:34px;flex:none;cursor:pointer}
/* stats */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em}.kpi .k{font-size:12.5px;color:var(--ink2);font-weight:600}
.kpi .s{font-size:12px;color:var(--mut)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:760px){.two{grid-template-columns:1fr}}
.hb{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:13.5px}
.hb .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;position:relative;padding:3px 6px;z-index:0}
.hb .l i{position:absolute;inset:1px auto 1px 0;background:var(--soft);border-radius:0 4px 4px 0;z-index:-1}
.hb .c{font-variant-numeric:tabular-nums;color:var(--ink2);padding:3px 0;text-align:right}
.chart{width:100%;height:150px;display:block}
.chart rect{fill:var(--teal)}.chart rect:hover{fill:var(--teal-d)}.chart .ax{fill:var(--mut);font-size:10px}
.chart line{stroke:var(--line)}
.tip{position:fixed;z-index:80;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;border-radius:7px;padding:4px 8px;white-space:nowrap}
.vit{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:12px;border-radius:6px;padding:1px 7px}
.vit.g{background:var(--ok-bg);color:var(--ok)}.vit.m{background:var(--warn-bg);color:var(--warn)}.vit.b{background:var(--bad-bg);color:var(--bad)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th,table.t td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{font-size:12px;color:var(--ink2)}
table.t td.n{text-align:right;font-variant-numeric:tabular-nums}
.ovw{overflow-x:auto}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;max-width:calc(100vw - 32px);box-shadow:0 6px 24px rgba(0,0,0,.25);display:none}
#toast.e{background:var(--bad);color:#fff}
.loading{padding:50px;text-align:center;color:var(--mut)}
.dlg{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg>div{background:var(--card);border-radius:16px;max-width:520px;width:100%;padding:16px 18px;max-height:85vh;overflow:auto}
.dlg ul{margin:8px 0;padding-left:20px;font-size:14px}.dlg .bt{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:14px}
</style>
</head>
<body>
<header class="top"><b>Dossard Péi</b><span class="tag">admin</span><span class="sp"></span><span id="who"></span><a href="/" target="_blank" rel="noopener">Voir le site ↗</a><a href="#" id="logout" hidden>Déconnexion</a></header>
<nav class="tabs" id="tabs" role="tablist">
  <button data-t="courses" aria-selected="true">Courses</button>
  <button data-t="messages">Messages<span class="bd a" id="nbm" hidden></span></button>
  <button data-t="clubs">Clubs</button>
  <button data-t="saison">Saison 2027</button>
  <button data-t="stats">Stats</button>
  <button data-t="sante">Santé</button>
</nav>
<main id="view"><div class="loading">Chargement…</div></main>
<div class="sheet" id="sheet" hidden></div>
<div id="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
"use strict";
/* ============ outils ============ */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const TODAY = new Date(Date.now() + 4 * 3600e3).toISOString().slice(0, 10);   // La Réunion
const MOIS = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
const fd = d => { if (!d) return ""; const [y, m, j] = d.split("-"); return `${+j} ${MOIS[+m - 1]} ${y}`; };
const slug = s => (s || "").normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/œ/g, "oe").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const nf = n => (n ?? 0).toLocaleString("fr-FR");
function toast(msg, err) { const t = $("#toast"); t.textContent = msg; t.className = err ? "e" : ""; t.style.display = "block"; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = "none", err ? 7000 : 3500); }
function dialog(html, buttons) {
  return new Promise(res => {
    const d = document.createElement("div"); d.className = "dlg";
    d.innerHTML = `<div>${html}<div class="bt">${buttons.map((b, i) => `<button class="btn ${b.cls || ""}" data-i="${i}">${esc(b.label)}</button>`).join("")}</div></div>`;
    d.addEventListener("click", e => { const b = e.target.closest("[data-i]"); if (b || e.target === d) { d.remove(); res(b ? buttons[+b.dataset.i].v : null); } });
    document.body.append(d);
  });
}
const confirmBox = (title, text, ok = "Confirmer", cls = "p") => dialog(`<h3 style="margin-top:0;text-transform:none;letter-spacing:0;color:var(--ink);font-size:17px">${esc(title)}</h3><p>${text}</p>`, [{ label: "Annuler", v: false }, { label: ok, v: true, cls }]);

/* ============ accès aux données (service admin) ============ */
const API = "/admin/api/";
async function api(p, opt = {}) {
  let r;
  try { r = await fetch(API + p, { ...opt, credentials: "same-origin", headers: { "x-admin": "1", "content-type": "application/json" } }); }
  catch (e) { throw Object.assign(new Error("Connexion impossible. Ta session a peut-être expiré : recharge la page."), { status: 0 }); }
  let j = {}; try { j = await r.json(); } catch (e) { if (r.status === 404 || r.status === 405) throw Object.assign(new Error("Le service admin n'est pas encore branché dans Cloudflare : suis le guide « Admin : mise en route »."), { status: 404 }); if (r.ok || r.status === 403) throw Object.assign(new Error("Session expirée : recharge la page pour te reconnecter."), { status: 401 }); }
  if (r.status === 401 && j.login && p !== "login") { showLogin(); throw Object.assign(new Error("Connexion nécessaire."), { status: 401, body: j }); }
  if (!r.ok) throw Object.assign(new Error(j.error || `Erreur ${r.status}`), { status: r.status, body: j });
  return j;
}
const F = {};   // chemin -> { sha, obj }
const FMT = {
  "data.json": o => JSON.stringify(o),
  "clubs/clubs.json": o => JSON.stringify(o),
  "state/overrides.json": o => JSON.stringify(o, null, 1),
  "saison2027.json": o => JSON.stringify(o, null, 1).replace(/^ +/gm, ""),
};
async function load(paths) {
  const j = await api("files?paths=" + paths.join(","));
  for (const [p, v] of Object.entries(j.files)) if (!v.error) F[p] = { sha: v.sha, obj: JSON.parse(v.text) }; else if (!F[p]) F[p] = { error: v.error };
}
/* enregistre : relit les fichiers juste avant, applique la modification dessus (ce que la synchro a changé
   entre-temps est gardé), envoie un seul commit ; recommence si la synchro est passée au même moment */
async function save(label, paths, mutate, extra = []) {
  for (let i = 0; i < 3; i++) {
    await load(paths);
    const objs = Object.fromEntries(paths.map(p => [p, clone(F[p].obj)]));
    mutate(objs);
    const files = paths.filter(p => FMT[p](objs[p]) !== FMT[p](F[p].obj)).map(p => ({ path: p, text: FMT[p](objs[p]) }));
    if (!files.length && !extra.length) return false;
    try {
      await api("commit", { method: "POST", body: JSON.stringify({ message: label, base: Object.fromEntries(files.map(f => [f.path, F[f.path].sha])), files: [...files, ...extra] }) });
      for (const f of files) F[f.path].obj = objs[f.path];
      return true;
    } catch (e) { if (e.status !== 409) throw e; await new Promise(r => setTimeout(r, 1500)); }
  }
  throw new Error("Les données changent en ce moment (synchro en cours). Réessaie dans une minute.");
}
async function run(btn, fn) {
  const t = btn && btn.textContent; if (btn) { btn.disabled = true; btn.textContent = "Enregistrement…"; }
  try { return await fn(); } catch (e) { toast(e.message, true); } finally { if (btn) { btn.disabled = false; btn.textContent = t; } }
}

/* ============ constantes métier ============ */
const TYPES = ["trail", "route", "cross", "marche", "relais", "jeunes", "multisport", "autre"];
const COMMUNES = ["Bras-Panon", "Cilaos", "Entre-Deux", "L'Étang-Salé", "La Plaine-des-Palmistes", "La Possession", "Le Port", "Le Tampon", "Les Avirons", "Les Trois-Bassins", "Petite-Île", "Saint-André", "Saint-Benoît", "Saint-Denis", "Saint-Joseph", "Saint-Leu", "Saint-Louis", "Saint-Paul", "Saint-Philippe", "Saint-Pierre", "Sainte-Marie", "Sainte-Rose", "Sainte-Suzanne", "Salazie"];
const LABEL = { nom: "Nom", date: "Date", fin: "Date de fin", commune: "Commune", lieu: "Lieu de départ", ll: "Position", org: "Organisateur", source: "Source", page: "Page de l'organisateur", inscription: "Lien d'inscription", fiche: "Page de la course", limite: "Clôture des inscriptions", avenir: "Inscriptions pas encore ouvertes", info: "Infos pratiques", complet: "Complet", annule: "Annulée", hidden: "Masquée", epreuves: "Épreuves", traces: "Tracés", affiche: "Affiche", poster: "Affiche", poster_lg: "Affiche (grande)", poster_xs: "Vignette", paiement: "Paiement" };
const EPL = { h: "heure", km: "distance", dp: "D+", prix: "prix", date: "date", limite: "clôture", url: "lien", note: "note", cat: "catégories", type: "type", complet: "complet", clos: "clos", ouverture: "ouverture" };
const lab = k => k.startsWith("ep:") ? (([n, f]) => `${EPL[f] || f} de « ${n} »`)(k.slice(3).match(/^(.*):([^:]*)$/).slice(1)) : LABEL[k] || k;
// verrou d'une info d'une épreuve : bouton 🔒 à côté de son libellé
const epLock = (e, k) => !ED.isNew && !ED.d.manual && ED.orig && ovOf(ED.d.id).fields.includes(`ep:${e.nom}:${k}`) ? ` <button type="button" class="lk on" data-unlock="${esc(`ep:${e.nom}:${k}`)}" title="Corrigé à la main : toucher pour rendre la main à la synchro">verrouillé</button>` : "";

/* ============ navigation ============ */
let TAB = "courses";
$("#tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; TAB = b.dataset.t; $$("#tabs button").forEach(x => x.setAttribute("aria-selected", x === b)); try { localStorage.setItem("adm-tab", TAB); } catch (e) { } render(); });
function render() { ({ courses: viewCourses, messages: viewMessages, clubs: viewClubs, saison: viewSaison, stats: viewStats, sante: viewSante })[TAB](); }

/* ============================================================
   COURSES
   ============================================================ */
let CF = { q: "", f: "avenir" };
const races = () => F["data.json"].obj.races;
const ovOf = id => ((F["state/overrides.json"].obj.overrides || {})[id]) || { fields: [], hidden: false };
function viewCourses() {
  const v = $("#view");
  const all = races();
  const filters = [["avenir", "À venir"], ["toutes", "Toutes"], ["visibles", "Visibles"], ["annulees", "Annulées"], ["masquees", "Masquées"], ["complets", "Complètes"], ["main", "Ajoutées à la main"], ["verrous", "Corrigées à la main"], ["sansaffiche", "Sans affiche"]];
  const test = {
    avenir: r => (r.fin || r.date) >= TODAY, toutes: () => true, visibles: r => !r.hidden, annulees: r => r.annule, masquees: r => r.hidden && !r.annule,
    complets: r => r.complet || (r.epreuves || []).length && r.epreuves.every(e => e.complet), main: r => r.manual, verrous: r => ovOf(r.id).fields.length, sansaffiche: r => !r.poster && !r.hidden,
  };
  const q = slug(CF.q);
  const list = all.filter(test[CF.f]).filter(r => !q || slug(`${r.nom} ${r.commune} ${r.org || ""} ${r.id}`).includes(q)).sort((a, b) => a.date.localeCompare(b.date));
  v.innerHTML = `<h2>Courses</h2>
  <div class="bar"><input class="search" id="cq" type="search" placeholder="Chercher une course, une commune, un organisateur…" value="${esc(CF.q)}"><button class="btn p" id="addr">+ Ajouter une course</button></div>
  <div class="chips">${filters.map(([k, l]) => `<button class="chip" data-f="${k}" aria-pressed="${CF.f === k}">${l} <span style="opacity:.7">${all.filter(test[k]).length}</span></button>`).join("")}</div>
  <div class="list">${list.map(rowRace).join("") || `<div class="empty">Aucune course</div>`}</div>`;
  $("#cq").addEventListener("input", e => { CF.q = e.target.value; const p = e.target.selectionStart; viewCourses(); const i = $("#cq"); i.focus(); i.setSelectionRange(p, p); });
  $$(".chip", v).forEach(c => c.onclick = () => { CF.f = c.dataset.f; viewCourses(); });
  $("#addr").onclick = () => editRace(null);

async function pickPoster(file) {

    const bmp = await createImageBitmap(file, { imageOrientation: "from-image" }).catch(() => null);

    const w = img.width, h = img.height, k = Math.min(1, 1600 / Math.max(w, h));
    if (Math.min(w, h) < 300) throw new Error("image trop petite (300 px minimum)");

    const cx = cv.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(img, 0, 0, cv.width, cv.height);
    const url = cv.toDataURL("image/jpeg", .9);
    ED.upload = { url, b64: url.split(",")[1] };
    $(".card:has(#pf)").innerHTML = `<h3 style="margin-top:4px">Affiche</h3>` + posterHTML();
    $("#pf").onchange = e => pickPoster(e.target.files[0]);
    const prm = $("#prm"); if (prm) prm.onclick = () => { ED.upload = null; $(".card:has(#pf)").innerHTML = `<h3 style="margin-top:4px">Affiche</h3>` + posterHTML(); $("#pf").onchange = e => pickPoster(e.target.files[0]); refreshChg(); };
    refreshChg();
  } catch (e) { toast("Image illisible : " + (e.message || e), true); }
}
function checkRace(d) {

  if (!/^\d{4}-\d{2}-\d{2}$/.test(d.date || "")) pb.push("la date est vide");
  if (d.fin && d.fin < d.date) pb.push("la date de fin est avant la date");
  if (!d.commune) pb.push("la commune est vide");
  if (d.ll && !(d.ll[0] < -20.8 && d.ll[0] > -21.45 && d.ll[1] > 55.15 && d.ll[1] < 55.9)) pb.push("la position n'est pas à La Réunion");
  for (const k of ["page", "inscription", "fiche"]) if (d[k] && !/^https?:\/\/\S+$/.test(d[k])) pb.push(`le lien « ${lab(k)} » n'est pas une adresse web`);

}
async function saveRace(btn) {
  const d = ED.d;
  if (ED.upload) { delete d.affiche; delete d.affiche_capture; }   // l'adresse de l'ancienne affiche ne correspond plus
  const keys = changedKeys();
  if (!keys.length && !ED.upload) { toast("Aucune modification."); return; }
  if (!d.epreuves || !d.epreuves.length) d.epreuves = [];
  const pb = checkRace(d);
  if (pb.length) { await dialog(`<h3 style="margin-top:0;text-transform:none;letter-spacing:0;color:var(--ink);font-size:17px">À corriger avant d'enregistrer</h3><ul>${pb.map(p => `<li>${esc(p)}</li>`).join("")}</ul>`, [{ label: "OK", v: 1, cls: "p" }]); return; }
  if (ED.isNew) {
    const base = slug(d.nom) + "-" + d.date.slice(0, 7);
    let id = base, n = 2; while (races().some(r => r.id === id)) id = `${base}-${n++}`;
    d.id = id; d.manual = true; if (!d.ll) delete d.ll;
  }
  // champs à verrouiller : ceux modifiés. Pour les épreuves, seulement l'info changée (« ep:<épreuve>:<info> »),
  // sauf si la liste elle-même change (ajout, retrait, nom, ordre) : alors toute la liste.
  const lock = new Set(keys.filter(k => !["poster_xs", "affiche_capture", "manual", "id"].includes(k)));
  let fine = null;   // [[nom, info, valeur ou undefined]]
  if (!ED.isNew && ED.orig && !d.manual && keys.includes("epreuves")) {
    const O = ED.orig.epreuves || [], N = d.epreuves || [];
    if (O.length === N.length && O.every((e, i) => e.nom === N[i].nom)) {
      fine = [];
      O.forEach((e, i) => { for (const k of new Set([...Object.keys(e), ...Object.keys(N[i])])) if (!same(e[k], N[i][k])) { fine.push([e.nom, k, N[i][k]]); lock.add(`ep:${e.nom}:${k}`); } });
      lock.delete("epreuves");
    }
  }
  if (ED.upload) ["poster", "poster_lg", "affiche"].forEach(k => lock.add(k));
  const extra = ED.upload ? [{ path: `posters/in/${d.id}.jpg`, b64: ED.upload.b64 }] : [];
  const label = ED.isNew ? `ajout de ${d.nom}` : `${d.nom} (${[...new Set([...keys.map(lab), ...(ED.upload ? ["affiche"] : [])])].join(", ")})`;
  await run(btn, async () => {
    const ok = await save(label, ["data.json", "state/overrides.json"], o => {
      const D = o["data.json"], O = o["state/overrides.json"];
      if (ED.isNew) { D.races.push(clone(d)); (O.manual = O.manual || []).includes(d.id) || O.manual.push(d.id); return; }
      const r = D.races.find(x => x.id === d.id); if (!r) throw new Error("cette course n'est plus dans les données (passée ?)");
      for (const k of keys) {
        if (k === "epreuves" && fine) {   // seulement les infos changées, sur les épreuves telles qu'elles sont maintenant
          for (const [nom, f, v] of fine) { const e = (r.epreuves || []).find(x => x.nom === nom); if (!e) throw new Error(`l'épreuve « ${nom} » a changé de nom entre-temps, recharge la page`); if (v === undefined) delete e[f]; else e[f] = clone(v); }
          continue;
        }
        if (k in d) r[k] = clone(d[k]); else delete r[k];
      }
      if (!r.manual) {
        const ov = O.overrides = O.overrides || {}, e = ov[d.id] = ov[d.id] || { fields: [], hidden: false };
        e.fields = [...new Set([...e.fields, ...lock])].sort(); e.hidden = !!r.hidden;
      }
    }, extra);
    if (ok === false) { toast("Aucune modification."); return; }
    toast(ED.isNew ? "Course ajoutée : en ligne dans 1 à 2 minutes." : "Enregistré : en ligne dans 1 à 2 minutes.");
    history.back();
  });
}

async function openMsg(id) {
  let m; try { m = await api("messages/" + encodeURIComponent(id)); } catch (e) { toast(e.message, true); return; }
  const target = (m.page || "").match(/\/(course|clubs)\/([a-z0-9-]+)\/?$/);

  const ch = Object.entries(m.champs || {}).filter(([k]) => k !== "Champs modifiés").sort((a, b) => mod.includes(b[0]) - mod.includes(a[0]));
  const subj = "Re : " + (m.sujet || m.objet || "ton message sur Dossard Péi");
  const quote = `\n\n—\nTon message du ${when(m.at)} :\n> ` + (m.message || ch.map(([k, x]) => `${k} : ${x}`).join("\n")).replace(/\n/g, "\n> ");
  const r = await dialog(`<div style="font-size:12.5px;color:var(--ink2)">${when(m.at)} · ${esc(MTYPE[m.type] || m.type)}</div>
    <h3 style="margin:4px 0 8px;text-transform:none;letter-spacing:0;color:var(--ink);font-size:17px">${esc(m.sujet || m.objet || "Message")}</h3>
    ${m.course || m.club ? `<p style="margin:0 0 8px"><b>${esc(m.course || m.club)}</b>${m.page ? ` · <a href="${esc(m.page)}" target="_blank" rel="noopener">voir ↗</a>` : ""}</p>` : ""}
    ${m.message ? `<div style="white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:10px 12px;font-size:14.5px">${esc(m.message)}</div>` : ""}
    ${ch.length ? `<table class="t" style="margin-top:8px">${ch.map(([k, x]) => `<tr${mod.includes(k) ? ' style="background:var(--soft)"' : ""}><th style="width:38%">${esc(k)}${mod.includes(k) ? `<br><span class="bd l" style="margin:2px 0 0">modifié</span>` : ""}</th><td style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(x)}</td></tr>`).join("")}</table>${mod.length ? `<p style="font-size:12.5px;color:var(--ink2);margin:6px 0 0">Infos changées par l'expéditeur : en premier, sur fond vert.</p>` : ""}` : ""}
    <p style="font-size:13.5px;margin:10px 0 0">De : ${esc(m.nom || "–")} · ${m.email ? `<a href="mailto:${esc(m.email)}">${esc(m.email)}</a>` : "pas d'e-mail"}</p>`,
    [{ label: "Supprimer", v: "del", cls: "d" }, ...(target ? [{ label: target[1] === "course" ? "Ouvrir la course" : "Ouvrir le club", v: "fiche" }] : []), ...(m.email ? [{ label: "Répondre", v: "rep" }] : []), { label: m.etat === "traite" ? "Remettre à traiter" : "Marquer traité", v: "etat", cls: "p" }]);
  if (!r) return;
  try {
    if (r === "rep") { location.href = `mailto:${m.email}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(quote)}`; return; }
    if (r === "fiche") {
      if (target[1] === "course" && races().some(x => x.id === target[2])) { TAB = "courses"; editRace(target[2]); }
      else if (target[1] === "clubs" && clubs().some(x => x.id === target[2])) { TAB = "clubs"; editClub(target[2]); }
      else window.open(m.page, "_blank");
      $$("#tabs button").forEach(x => x.setAttribute("aria-selected", x.dataset.t === TAB));
      return;
    }
    if (r === "del") { if (!await confirmBox("Supprimer ce message ?", "Il sera effacé définitivement.", "Supprimer", "d")) return; await api("messages/" + encodeURIComponent(id), { method: "DELETE" }); MSGS = MSGS.filter(x => x.id !== id); toast("Message supprimé."); }
    if (r === "etat") { const etat = m.etat === "traite" ? "nouveau" : "traite"; await api("messages/" + encodeURIComponent(id), { method: "POST", body: JSON.stringify({ etat }) }); const x = MSGS.find(x => x.id === id); if (x) x.etat = etat; toast(etat === "traite" ? "Marqué comme traité." : "Remis à traiter."); }
    badge(); viewMessages();
  } catch (e) { toast(e.message, true); }
}

function viewSaison() {
  const S = F["saison2027.json"].obj, v = $("#view"), q = slug(SQ);
  const ev = S.evenements.map((e, i) => ({ e, i })).filter(({ e }) => !q || slug(`${e.nom} ${e.club} ${e.nature}`).includes(q)).sort((a, b) => a.e.date.localeCompare(b.e.date));
  const ids = races().map(r => r.id);
  v.innerHTML = `<h2>Saison 2027 <span style="color:var(--mut);font-weight:500;font-size:15px">${S.evenements.length} dates · mis à jour le ${fd(S.maj)}</span></h2>
  <div class="note">Calendrier provisoire affiché replié par mois dans la Liste. Une date reliée à une course du site (« fiche ») renvoie vers sa fiche.</div>
  <div class="bar"><input class="search" id="sq" type="search" placeholder="Chercher…" value="${esc(SQ)}"><button class="btn p" id="adds">+ Ajouter une date</button></div>
  <div class="list">${ev.map(({ e, i }) => `<button class="row" data-i="${i}"><span class="ph" style="display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:var(--teal);background:var(--soft)">${e.date.slice(8)}/${e.date.slice(5, 7)}</span><span class="t"><span class="n">${esc(e.nom)}${e.champ ? `<span class="bd c">Championnat</span>` : ""}${e.id ? `<span class="bd ok">fiche</span>` : ""}</span><span class="m">${esc(e.nature || "")} · ${esc(e.club || "")}</span></span></button>`).join("")}</div>`;
  $("#sq").addEventListener("input", e => { SQ = e.target.value; const p = e.target.selectionStart; viewSaison(); const i = $("#sq"); i.focus(); i.setSelectionRange(p, p); });
  const edit = async i => {
    const e = i == null ? { nom: "", nature: "Trail", club: "", date: "2027-01-01" } : clone(S.evenements[i]);
    const nat = ["Trail", "Route", "Cross", "Course Montagne", "Ultra Trail", "Course Obstacles"];
    const r = await dialog(`<h3 style="margin-top:0;text-transform:none;letter-spacing:0;color:var(--ink);font-size:17px">${i == null ? "Nouvelle date" : "Modifier la date"}</h3>
      <div class="grid" style="grid-template-columns:1fr 1fr">
        <div class="f w"><label>Nom</label><input id="s-nom" value="${esc(e.nom)}"></div>
        <div class="f"><label>Date</label><input id="s-date" type="date" value="${esc(e.date)}"></div>
        <div class="f"><label>Fin (si plusieurs jours)</label><input id="s-fin" type="date" value="${esc(e.fin || "")}"></div>
        <div class="f"><label>Nature</label><input id="s-nat" list="dlnat" value="${esc(e.nature || "")}"><datalist id="dlnat">${nat.map(n => `<option value="${n}">`).join("")}</datalist></div>
        <div class="f"><label>Club / organisateur</label><input id="s-club" value="${esc(e.club || "")}"></div>
        <div class="f w"><label>Info</label><input id="s-info" value="${esc(e.info || "")}"></div>
        <div class="f w"><label>Fiche sur le site (si la course y est déjà)</label><select id="s-id"><option value="">Aucune</option>${races().slice().sort((a, b) => a.date.localeCompare(b.date)).map(r => `<option value="${esc(r.id)}" ${r.id === e.id ? "selected" : ""}>${fd(r.date)} · ${esc(r.nom)}</option>`).join("")}${e.id && !ids.includes(e.id) ? `<option selected value="${esc(e.id)}">${esc(e.id)}</option>` : ""}</select></div>
        <div class="f w"><label class="ck"><input type="checkbox" id="s-ch" ${e.champ ? "checked" : ""}>Championnat</label></div>
      </div>`, [...(i != null ? [{ label: "Supprimer", v: "del", cls: "d" }] : []), { label: "Annuler", v: null }, { label: "Enregistrer", v: "ok", cls: "p" }].map(b => {
      if (b.v !== "ok") return b;
      return { ...b, v: "ok" };
    }));
    return r;
  };
  const open = async i => {
    // lit les champs avant que la boîte se ferme
    const grab = () => ({ nom: $("#s-nom").value.trim(), date: $("#s-date").value, fin: $("#s-fin").value, nature: $("#s-nat").value.trim(), club: $("#s-club").value.trim(), info: $("#s-info").value.trim(), id: $("#s-id").value, champ: $("#s-ch").checked });
    let vals = null;
    const h = ev => { if (ev.target.closest('[data-i]') && $("#s-nom")) vals = grab(); };
    document.addEventListener("click", h, true);
    const r = await edit(i);
    document.removeEventListener("click", h, true);
    if (!r) return;
    if (r === "ok" && (!vals.nom || !/^\d{4}-/.test(vals.date))) { toast("Nom et date obligatoires.", true); return; }
    const old = i == null ? null : clone(S.evenements[i]);
    await run(null, async () => {
      await save(r === "del" ? `saison 2027 : ${old.nom} retiré` : `saison 2027 : ${vals.nom}`, ["saison2027.json"], o => {
        const X = o["saison2027.json"]; X.maj = TODAY;
        const j = old ? X.evenements.findIndex(x => same(x, old)) : -1;
        if (old && j < 0) throw new Error("cette date a changé entre-temps, recharge la page");
        if (r === "del") { X.evenements.splice(j, 1); return; }
        const n = { nom: vals.nom, nature: vals.nature, club: vals.club, date: vals.date };
        if (vals.fin) n.fin = vals.fin; if (vals.champ) n.champ = true; if (vals.info) n.info = vals.info; if (vals.id) n.id = vals.id;
        if (old) { for (const k of ["nd", "org"]) if (k in old) n[k] = old[k]; X.evenements[j] = n; } else X.evenements.push(n);
        X.evenements.sort((a, b) => a.date.localeCompare(b.date));
      });
      toast("Enregistré : en ligne dans 1 à 2 minutes."); viewSaison();
    });
  };
  $("#adds").onclick = () => open(null);
  $$(".row[data-i]", v).forEach(b => b.onclick = () => open(+b.dataset.i));
}

/* ============================================================

let SP = 30, ME = {};
const STC = {};
const gcGet = async (p, q) => { const u = new URLSearchParams(); for (const [a, b] of Object.entries(q)) [].concat(b).forEach(x => u.append(a, x)); const k = p + "?" + u; if (!STC[k]) STC[k] = api("gc/" + k).catch(e => { delete STC[k]; throw e; }); return STC[k]; };
const range = days => { const e = new Date(Date.now() + 4 * 3600e3), s = new Date(e - (days - 1) * 864e5); return { start: s.toISOString().slice(0, 10), end: e.toISOString().slice(0, 10) }; };
const EVG = { raccourci: "Raccourcis", favori: "Favoris", agenda: "Ajout à l'agenda", bandeau: "Bandeau « Nouveau »", sortie: "Clics vers les organisateurs", mode: "Mode choisi (Liste / Scroll…)", arrivee: "Arrivée sur le site par mode", "arrivee-partage": "Arrivées par un lien partagé" };
function hbars(items, max) {
  max = max || Math.max(1, ...items.map(x => x.n));
  return `<div class="hb">${items.map(x => `<span class="l" title="${esc(x.t || x.l)}"><i style="width:${(x.n / max * 100).toFixed(1)}%"></i>${esc(x.l)}</span><span class="c">${nf(x.n)}</span>`).join("")}</div>`;
}
function dayChart(days) {
  const W = 700, H = 140, P = 2, n = days.length, max = Math.max(1, ...days.map(d => d.n)), bw = (W - 2) / n;
  const tick = Math.pow(10, Math.floor(Math.log10(max))), top = Math.ceil(max / tick) * tick;
  const y = v => H - P - v / top * (H - P - 8);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Visites par jour">
   <line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}"/><line x1="0" x2="${W}" y1="${y(top)}" y2="${y(top)}" stroke-dasharray="2 4"/>
   ${days.map((d, i) => { const h = Math.max(d.n ? 2 : 0, y(0) - y(d.n)); const x = i * bw + 1, w = Math.max(1, bw - 2); return `<rect data-tip="${fd(d.day)} : ${nf(d.n)} visiteur${d.n > 1 ? "s" : ""}" x="${x}" y="${y(0) - h}" width="${w}" height="${h}" rx="${Math.min(4, w / 2)}"/>`; }).join("")}
   </svg><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:2px"><span>${fd(days[0]?.day)}</span><span>max. ${nf(max)} / jour</span><span>${fd(days[n - 1]?.day)}</span></div>`;
}
document.addEventListener("mousemove", e => { const t = e.target.closest && e.target.closest("[data-tip]"); let tp = $(".tip"); if (!t) { tp && tp.remove(); return; } if (!tp) { tp = document.createElement("div"); tp.className = "tip"; document.body.append(tp); } tp.textContent = t.dataset.tip; tp.style.left = Math.min(innerWidth - tp.offsetWidth - 8, e.clientX + 12) + "px"; tp.style.top = e.clientY - 30 + "px"; });
async function viewStats() {
  const v = $("#view");
  v.innerHTML = `<h2>Stats</h2><div class="chips">${[[7, "7 jours"], [30, "30 jours"], [90, "90 jours"]].map(([d, l]) => `<button class="chip" data-d="${d}" aria-pressed="${SP === d}">${l}</button>`).join("")}</div><div id="gcbox"><div class="loading">Chargement des visites…</div></div><div id="cfbox"></div>`;
  $$(".chip", v).forEach(c => c.onclick = () => { SP = +c.dataset.d; viewStats(); });
  const R = range(SP);
  // ---- compteur d'audience ----
  const gb = $("#gcbox");
  if (!ME.gc) gb.innerHTML = `<div class="card"><b>Compteur d'audience non relié.</b><p style="font-size:14px;color:var(--ink2)">Ajoute la clé de lecture du compteur dans le service admin (voir le guide de mise en route).</p></div>`;
  else try {
    const pause = () => new Promise(r => setTimeout(r, 300));
    const tot = await gcGet("stats/total", R); await pause();
    const refs = await gcGet("stats/toprefs", { ...R, limit: 12 }).catch(() => ({})); await pause();
    const sizes = await gcGet("stats/sizes", R).catch(() => ({})); await pause();
    const locs = await gcGet("stats/locations", { ...R, limit: 8 }).catch(() => ({})); await pause();
    // toutes les pages et tous les clics suivis : 100 par appel, les suivants en excluant ceux déjà reçus
    const H = [];
    let partial = false;
    for (let i = 0; i < 20; i++) {
      let h = null;
      if (!H.length) h = await gcGet("stats/hits", { ...R, limit: 100 });
      else {   // le compteur limite à 4 appels par seconde ; deux écritures possibles de la liste à exclure
        await new Promise(r => setTimeout(r, 350));
        h = await gcGet("stats/hits", { ...R, limit: 100, exclude_paths: H.map(x => x.path_id).join(",") }).catch(() => null);
        if (!h) { await new Promise(r => setTimeout(r, 350)); h = await gcGet("stats/hits", { ...R, limit: 100, exclude_paths: H.map(x => x.path_id) }).catch(() => null); }
        if (!h) { partial = true; break; }
      }
      H.push(...(h.hits || []));
      if (!h.more || !(h.hits || []).length) break;
    }
    // le total du compteur inclut les clics suivis : on les retire pour n'avoir que les visiteurs des pages
    const evDay = {};
    for (const h of H) if (h.event) for (const st of h.stats || []) evDay[st.day] = (evDay[st.day] || 0) + (st.daily || 0);
    const days = (tot.stats || []).map(s => ({ day: s.day, n: Math.max(0, (s.daily ?? (s.hourly || []).reduce((a, b) => a + b, 0)) - (evDay[s.day] || 0)) }));
    const visitors = Math.max(0, (tot.total || 0) - (tot.total_events || 0));
    const pages = H.filter(h => !h.event), evs = H.filter(h => h.event);
    const grp = {};
    for (const h of evs) { const p = h.path.replace(/^\//, ""); const g = p.startsWith("arrivee-partage") ? "arrivee-partage" : p.split("/")[0]; (grp[g] = grp[g] || []).push({ l: p.slice(g.length).replace(/^\//, "") || p, t: h.title, n: h.count }); }
    const sum = a => a.reduce((s, x) => s + x.n, 0);
    const modes = (grp.mode || []).concat();
    const ret = Math.round(days.reduce((a, d) => a + d.n, 0) / Math.max(1, days.length));
    gb.innerHTML = `<div class="kpis">
      <div class="kpi"><div class="k">Visiteurs</div><div class="v">${nf(visitors)}</div><div class="s">${nf(ret)} par jour en moyenne (une personne compte une fois par page et par jour)</div></div>
      <div class="kpi"><div class="k">Clics suivis</div><div class="v">${nf(tot.total_events ?? sum(evs.map(h => ({ n: h.count }))))}</div><div class="s">favoris, agenda, partages…</div></div>
      <div class="kpi"><div class="k">Clics vers les organisateurs</div><div class="v">${nf(sum(grp.sortie || []))}</div><div class="s">inscriptions, pages officielles</div></div>
      <div class="kpi"><div class="k">Favoris ajoutés</div><div class="v">${nf(sum((grp.favori || []).filter(x => x.l.startsWith("ajout"))))}</div><div class="s">${nf(sum((grp.favori || []).filter(x => x.l.startsWith("retrait"))))} retirés</div></div>
    </div>
    <div class="card"><h3 style="margin-top:2px">Visiteurs par jour</h3>${days.length ? dayChart(days) : `<div class="empty">Pas de données</div>`}</div>
    <div class="two">
      <div class="card"><h3 style="margin-top:2px">Pages les plus vues</h3>${hbars(pages.slice(0, 15).map(h => ({ l: h.path === "/" ? "Accueil" : h.path, t: h.title, n: h.count })))}</div>
      <div class="card"><h3 style="margin-top:2px">Provenance</h3>${hbars((refs.stats || []).map(r => ({ l: r.name || "Accès direct", n: r.count })))}</div>
    </div>
    ${modes.length ? `<div class="card"><h3 style="margin-top:2px">Liste ou Scroll ?</h3>${hbars(modes.map(x => ({ ...x, l: x.l.charAt(0).toUpperCase() + x.l.slice(1) })).sort((a, b) => b.n - a.n))}${(grp.arrivee || []).length ? `<p style="font-size:13px;color:var(--ink2);margin:10px 0 4px">Mode affiché à l'arrivée :</p>${hbars(grp.arrivee.map(x => ({ ...x, l: x.l.charAt(0).toUpperCase() + x.l.slice(1) })).sort((a, b) => b.n - a.n))}` : ""}</div>` : ""}
    <div class="card"><h3 style="margin-top:2px">Clics suivis</h3>${partial ? `<p class="note w">Le compteur n'a pas tout renvoyé : liste incomplète. Réessaie dans une minute.</p>` : ""}${Object.entries(grp).filter(([g]) => g !== "mode" && g !== "arrivee").sort((a, b) => sum(b[1]) - sum(a[1])).map(([g, it]) => `<details style="margin:4px 0"><summary style="cursor:pointer;display:flex;justify-content:space-between;gap:10px;padding:5px 0"><b style="font-weight:600">${esc(EVG[g] || g)}</b><span style="color:var(--ink2);font-variant-numeric:tabular-nums">${nf(sum(it))}</span></summary>${hbars(it.sort((a, b) => b.n - a.n).slice(0, 20))}</details>`).join("") || `<div class="empty">Aucun clic suivi sur la période</div>`}</div>
    <div class="two">
      <div class="card"><h3 style="margin-top:2px">Écrans</h3>${hbars((sizes.stats || []).map(s => ({ l: ({ phone: "Téléphone", largephone: "Grand téléphone", tablet: "Tablette", desktop: "Ordinateur", desktophd: "Grand écran", unknown: "Inconnu" })[s.id] || s.name, n: s.count })))}</div>
      <div class="card"><h3 style="margin-top:2px">Pays</h3>${hbars((locs.stats || []).map(s => ({ l: s.name || s.id, n: s.count })))}</div>
    </div>`;
  } catch (e) { gb.innerHTML = `<div class="card note w">Visites indisponibles : ${esc(e.message)}</div>`; }
  // ---- Web Analytics et trafic ----
  const cb = $("#cfbox");
  if (!ME.cf) { cb.innerHTML = `<div class="card"><b>Vitesse réelle et trafic : non reliés.</b><p style="font-size:14px;color:var(--ink2)">S'activent avec le jeton de lecture des statistiques (voir le guide).</p></div>`; return; }
  cb.innerHTML = `<div class="loading">Chargement de la vitesse…</div>`;
  try {
    const q = `query($account:String!,$zone:String!,$site:String!,$s:Time!,$e:Time!,$sd:Date!,$ed:Date!){viewer{
      accounts(filter:{accountTag:$account}){
        vis: rumPageloadEventsAdaptiveGroups(limit:1,filter:{siteTag:$site,datetime_geq:$s,datetime_leq:$e}){count sum{visits}}
        cwv: rumWebVitalsEventsAdaptiveGroups(limit:1,filter:{siteTag:$site,datetime_geq:$s,datetime_leq:$e}){count quantiles{largestContentfulPaintP75 cumulativeLayoutShiftP75 interactionToNextPaintP75}}
        cwvp: rumWebVitalsEventsAdaptiveGroups(limit:12,orderBy:[count_DESC],filter:{siteTag:$site,datetime_geq:$s,datetime_leq:$e}){count dimensions{requestPath} quantiles{largestContentfulPaintP75 cumulativeLayoutShiftP75 interactionToNextPaintP75}}
        cwvd: rumWebVitalsEventsAdaptiveGroups(limit:6,orderBy:[count_DESC],filter:{siteTag:$site,datetime_geq:$s,datetime_leq:$e}){count dimensions{deviceType} quantiles{largestContentfulPaintP75 cumulativeLayoutShiftP75 interactionToNextPaintP75}}
      }
      zones(filter:{zoneTag:$zone}){ tr: httpRequests1dGroups(limit:100,filter:{date_geq:$sd,date_leq:$ed}){sum{requests cachedRequests threats bytes pageViews} uniq{uniques}} }
    }}`;
    const j = await api("cf", { method: "POST", body: JSON.stringify({ query: q, variables: { s: R.start + "T00:00:00Z", e: new Date().toISOString(), sd: R.start, ed: R.end } }) });
    if (j.errors && j.errors.length && !j.data) throw new Error(j.errors[0].message);
    const A = (j.data?.viewer?.accounts || [])[0] || {}, Z = (j.data?.viewer?.zones || [])[0] || {};
    const qq = (A.cwv || [])[0]?.quantiles || {};
    // Cloudflare donne LCP et INP en microsecondes ; une valeur négative veut dire « pas assez de mesures »
    const lcp = u => u == null || u < 0 ? "–" : (v => `<span class="vit ${v <= 2500 ? "g" : v <= 4000 ? "m" : "b"}">${v <= 2500 ? "✓" : v <= 4000 ? "~" : "✕"} ${(v / 1000).toFixed(1).replace(".", ",")} s</span>`)(u / 1000);
    const cls = v => v == null || v < 0 ? "–" : `<span class="vit ${v <= .1 ? "g" : v <= .25 ? "m" : "b"}">${v <= .1 ? "✓" : v <= .25 ? "~" : "✕"} ${v.toFixed(2).replace(".", ",")}</span>`;
    const inp2 = u => u == null || u < 0 ? "–" : (v => `<span class="vit ${v <= 200 ? "g" : v <= 500 ? "m" : "b"}">${v <= 200 ? "✓" : v <= 500 ? "~" : "✕"} ${Math.round(v)} ms</span>`)(u / 1000);
    const tr = (Z.tr || []).reduce((a, g) => { for (const k in g.sum) a[k] = (a[k] || 0) + g.sum[k]; a.uniques = (a.uniques || 0) + (g.uniq?.uniques || 0); return a; }, {});
    const vis = (A.vis || [])[0];
    cb.innerHTML = `<h3>Vitesse réelle chez les visiteurs</h3>
      <div class="kpis">
        <div class="kpi"><div class="k">Affichage du contenu (LCP)</div><div class="v" style="font-size:20px">${lcp(qq.largestContentfulPaintP75)}</div><div class="s">bon : ≤ 2,5 s</div></div>
        <div class="kpi"><div class="k">Stabilité de la page (CLS)</div><div class="v" style="font-size:20px">${cls(qq.cumulativeLayoutShiftP75)}</div><div class="s">bon : ≤ 0,10</div></div>
        <div class="kpi"><div class="k">Réactivité (INP)</div><div class="v" style="font-size:20px">${inp2(qq.interactionToNextPaintP75)}</div><div class="s">bon : ≤ 200 ms</div></div>
        <div class="kpi"><div class="k">Visites mesurées</div><div class="v">${nf(vis?.sum?.visits)}</div><div class="s">${nf(vis?.count)} pages vues</div></div>
      </div>
      <p style="font-size:12.5px;color:var(--mut)">Valeur atteinte par 75 % des visites (méthode Google).</p>
      <div class="two">
      <div class="card ovw"><h3 style="margin-top:2px">Par page</h3><table class="t"><tr><th>Page</th><th>LCP</th><th>CLS</th><th>INP</th></tr>${(A.cwvp || []).filter(g => !/^\/admin/.test(g.dimensions.requestPath)).map(g => `<tr><td>${esc(g.dimensions.requestPath)}</td><td>${lcp(g.quantiles.largestContentfulPaintP75)}</td><td>${cls(g.quantiles.cumulativeLayoutShiftP75)}</td><td>${inp2(g.quantiles.interactionToNextPaintP75)}</td></tr>`).join("")}</table></div>
      <div class="card ovw"><h3 style="margin-top:2px">Par appareil</h3><table class="t"><tr><th>Appareil</th><th>LCP</th><th>CLS</th><th>INP</th></tr>${(A.cwvd || []).map(g => `<tr><td>${esc(({ mobile: "Téléphone", desktop: "Ordinateur", tablet: "Tablette" })[g.dimensions.deviceType] || g.dimensions.deviceType)}</td><td>${lcp(g.quantiles.largestContentfulPaintP75)}</td><td>${cls(g.quantiles.cumulativeLayoutShiftP75)}</td><td>${inp2(g.quantiles.interactionToNextPaintP75)}</td></tr>`).join("")}</table></div>
      </div>
      <h3>Trafic reçu (robots compris)</h3>
      <div class="kpis">
        <div class="kpi"><div class="k">Requêtes</div><div class="v">${nf(tr.requests)}</div><div class="s">${tr.requests ? Math.round(tr.cachedRequests / tr.requests * 100) : 0} % servies depuis le cache</div></div>
        <div class="kpi"><div class="k">Visiteurs uniques</div><div class="v">${nf(tr.uniques)}</div><div class="s">adresses distinctes, robots compris</div></div>
        <div class="kpi"><div class="k">Menaces bloquées</div><div class="v">${nf(tr.threats)}</div><div class="s">&nbsp;</div></div>
        <div class="kpi"><div class="k">Données servies</div><div class="v">${((tr.bytes || 0) / 1e9).toFixed(2).replace(".", ",")} Go</div><div class="s">&nbsp;</div></div>
      </div>${j.errors && j.errors.length ? `<p class="note w">Une partie des mesures n'a pas répondu : ${esc(j.errors[0].message)}</p>` : ""}`;
  } catch (e) { cb.innerHTML = `<div class="card note w">Vitesse et trafic indisponibles : ${esc(e.message)}</div>`; }
}

async function viewSante() {
  const v = $("#view");
  v.innerHTML = `<h2>Santé</h2><div class="loading">Chargement…</div>`;
  try {
    await load(["data.json", "state/health.json", "state/todo.json", "state/partiels.json", "state/journal.json"]);
    const hist = await api("history").catch(() => []);
    const D = F["data.json"].obj, Hh = F["state/health.json"]?.obj || {}, T = F["state/todo.json"]?.obj || {}, P = F["state/partiels.json"]?.obj || {}, J = F["state/journal.json"]?.obj || [];
    const up = races().filter(r => !r.hidden && (r.fin || r.date) >= TODAY);
    const ago = iso => { const m = Math.round((Date.now() - new Date(iso)) / 6e4); return m < 60 ? `il y a ${m} min` : m < 48 * 60 ? `il y a ${Math.round(m / 60)} h` : `il y a ${Math.round(m / 1440)} j`; };
    const noPoster = up.filter(r => !r.poster), noLL = up.filter(r => !r.ll), noIns = up.filter(r => !r.inscription && !r.complet);
    const KJ = { ajout: "Ajout", date: "Date", heure: "Heure", distance: "Distance", "dénivelé": "D+", lieu: "Lieu", retrait: "Retrait", complet: "Complet", clos: "Clos", "réouvert": "Réouvert", ouverture: "Ouverture" };
    v.innerHTML = `<h2>Santé</h2>
    <div class="kpis">
      <div class="kpi"><div class="k">Données modifiées</div><div class="v" style="font-size:20px">${ago(D.updatedAt)}</div><div class="s">${T.at ? `dernier contrôle des sources ${ago(T.at)}` : ""}</div></div>
      <div class="kpi"><div class="k">Courses à venir</div><div class="v">${up.length}</div><div class="s">${races().filter(r => r.annule).length} annulée(s) affichée(s)</div></div>
      <div class="kpi"><div class="k">Sans affiche</div><div class="v">${noPoster.length}</div><div class="s">courses visibles</div></div>
      <div class="kpi"><div class="k">Sources en erreur</div><div class="v">${Object.values(Hh).filter(x => x.etat !== "ok").length + (T.illisibles || []).length}</div><div class="s">sur ${Object.keys(Hh).length + (D.sources || []).length} suivies</div></div>
    </div>
    <div class="two">
      <div class="card ovw"><h3 style="margin-top:2px">Lecture des plateformes</h3><table class="t"><tr><th>Plateforme</th><th>État</th><th>Lu</th></tr>${Object.entries(Hh).map(([k, x]) => `<tr><td>${esc(k)}</td><td>${x.etat === "ok" ? `<span class="vit g">✓ ok</span>` : `<span class="vit b">✕ ${esc(x.etat)}</span>${x.echecs ? ` <small>${x.echecs} échec(s)</small>` : ""}`}</td><td>${esc(Object.entries(x.ref || {}).map(([a, b]) => `${b} ${a}`).join(", "))}</td></tr>`).join("")}</table></div>
      <div class="card"><h3 style="margin-top:2px">Sites illisibles</h3>${(T.illisibles || []).length ? `<table class="t">${T.illisibles.map(x => `<tr><td><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.id)}</a></td><td>${esc(x.erreur)}</td></tr>`).join("")}</table>` : `<p class="empty">Aucun</p>`}
        ${Object.keys(P).length ? `<h3>Épreuves non reconnues</h3><table class="t">${Object.entries(P).map(([id, x]) => `<tr><td>${esc(id)}</td><td>${esc((x.epreuves || []).join(", "))}</td></tr>`).join("")}</table>` : ""}</div>
    </div>
    <div class="two">
      <div class="card"><h3 style="margin-top:2px">À compléter</h3>
        ${[["Sans affiche", noPoster], ["Sans position", noLL], ["Sans lien d'inscription", noIns]].map(([t, l]) => `<details><summary style="cursor:pointer;padding:5px 0;display:flex;justify-content:space-between"><b style="font-weight:600">${t}</b><span>${l.length}</span></summary>${l.map(r => `<button class="row" data-id="${esc(r.id)}" style="padding:6px 10px;margin:3px 0"><span class="t"><span class="n" style="font-size:14px">${esc(r.nom)}</span><span class="m">${fd(r.date)} · ${esc(r.commune)}</span></span></button>`).join("")}</details>`).join("")}
      </div>
      <div class="card"><h3 style="margin-top:2px">Derniers changements détectés</h3><table class="t">${J.slice(-15).reverse().map(x => `<tr><td style="white-space:nowrap;color:var(--ink2)">${esc((x.at || "").slice(8, 10) + "/" + (x.at || "").slice(5, 7))}</td><td><span class="bd">${esc(KJ[x.t] || x.t)}</span></td><td>${esc(x.nom)}${x.de ? ` <small style="color:var(--ink2)">${esc(x.de)} → ${esc(x.a)}</small>` : ""}</td></tr>`).join("")}</table></div>
    </div>
    <div class="card ovw"><h3 style="margin-top:2px">Historique des mises à jour</h3><table class="t">${hist.map(c => `<tr><td style="white-space:nowrap;color:var(--ink2)">${new Date(c.at).toLocaleString("fr-FR", { timeZone: "Indian/Reunion", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })}</td><td>${/^Admin/.test(c.msg) ? `<span class="bd l">toi</span> ` : ""}${esc(c.msg)}</td><td><a href="${esc(c.url)}" target="_blank" rel="noopener">détail ↗</a></td></tr>`).join("")}</table>
      <p style="font-size:12.5px;color:var(--mut)">Chaque modification reste dans l'historique : on peut toujours revenir en arrière.</p></div>`;
    $$(".row[data-id]", v).forEach(r => r.onclick = () => { TAB = "courses"; $$("#tabs button").forEach(x => x.setAttribute("aria-selected", x.dataset.t === "courses")); editRace(r.dataset.id); });
  } catch (e) { v.innerHTML = `<h2>Santé</h2><div class="card note w">${esc(e.message)}</div>`; }
}

/* ============ connexion ============ */
function showLogin() {
  if ($("#login")) return;
  $("#sheet").hidden = true; $("#tabs").hidden = true; $("#logout").hidden = true;
  $("#view").innerHTML = `<form id="login" class="card" style="max-width:380px;margin:40px auto;padding:20px">
    <h2 style="margin-top:0">Connexion</h2>
    <div class="f"><label for="pw">Mot de passe</label><input id="pw" type="password" autocomplete="current-password" required></div>
    <label class="ck" style="margin-top:6px"><input type="checkbox" id="pwshow">Afficher le mot de passe</label>
    <button class="btn p" style="width:100%;margin-top:12px">Entrer</button>
    <p id="pwerr" style="color:var(--bad);font-size:14px;min-height:1.2em;margin:10px 0 0"></p>
    <p style="font-size:12.5px;color:var(--mut);margin:4px 0 0">Tu restes connecté 30 jours sur cet appareil.</p></form>`;
  $("#pwshow").onchange = e => $("#pw").type = e.target.checked ? "text" : "password";
  $("#pw").focus();
  $("#login").onsubmit = async e => {
    e.preventDefault(); const b = e.target.querySelector("button"); b.disabled = true; $("#pwerr").textContent = "";
    try { await api("login", { method: "POST", body: JSON.stringify({ password: $("#pw").value }) }); location.reload(); }
    catch (err) { $("#pwerr").textContent = err.message; b.disabled = false; $("#pw").select(); }
  };
}
$("#logout").onclick = async e => { e.preventDefault(); await api("logout").catch(() => { }); location.reload(); };

/* ============ démarrage ============ */
(async () => {
  try {
    ME = await api("me");
    $("#who").textContent = ME.email && ME.email !== "admin" ? ME.email : "";
    $("#logout").hidden = false;
    await load(["data.json", "state/overrides.json", "clubs/clubs.json", "saison2027.json"]);
    try { const t = localStorage.getItem("adm-tab"); if (t && $(`#tabs [data-t="${t}"]`)) { TAB = t; $$("#tabs button").forEach(x => x.setAttribute("aria-selected", x.dataset.t === t)); } } catch (e) { }
    render();
    if (TAB !== "messages") loadMsgs().catch(() => { });   // pastille du nombre de messages à traiter
  } catch (e) {
    if (e.status === 401) return;   // écran de connexion affiché
    $("#view").innerHTML = `<div class="card note w" style="margin-top:20px"><b>${e.status === 403 ? "Accès refusé." : "Impossible de charger l'admin."}</b><br>${esc(e.message)}</div>`;
  }
})();
</script>
