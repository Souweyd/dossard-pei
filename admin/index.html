<script>
"use strict";
/* ============ outils ============ */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const TODAY = new Date(Date.now() + 4 * 3600e3).toISOString().slice(0, 10);   // La Réunion
const MOIS = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
const fd = d => { if (!d) return ""; const [y, m, j] = d.split("-"); return `${+j} ${MOIS[+m - 1]} ${y}`; };
const slug = s => (s || "").normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/œ/g, "oe").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const nf = n => (n ?? 0).toLocaleString("fr-FR");
function toast(msg, err) { const t = $("#toast"); t.textContent = msg; t.className = err ? "e" : ""; t.style.display = "block"; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = "none", err ? 7000 : 3500); }
function dialog(html, buttons) {
  return new Promise(res => {
    const d = document.createElement("div"); d.className = "dlg";
    d.innerHTML = `<div>${html}<div class="bt">${buttons.map((b, i) => `<button class="btn ${b.cls || ""}" data-i="${i}">${esc(b.label)}</button>`).join("")}</div></div>`;
    d.addEventListener("click", e => { const b = e.target.closest("[data-i]"); if (b || e.target === d) { d.remove(); res(b ? buttons[+b.dataset.i].v : null); } });
    document.body.append(d);
  });
}
const confirmBox = (title, text, ok = "Confirmer", cls = "p") => dialog(`<h3 style="margin-top:0;text-transform:none;letter-spacing:0;color:var(--ink);font-size:17px">${esc(title)}</h3><p>${text}</p>`, [{ label: "Annuler", v: false }, { label: ok, v: true, cls }]);

/* ============ accès aux données (service admin) ============ */
const API = "/admin/api/";
async function api(p, opt = {}) {
  let r;
  try { r = await fetch(API + p, { ...opt, credentials: "same-origin", headers: { "x-admin": "1", "content-type": "application/json" } }); }
  catch (e) { throw Object.assign(new Error("Connexion impossible. Ta session a peut-être expiré : recharge la page."), { status: 0 }); }
  let j = {}; try { j = await r.json(); } catch (e) { if (r.status === 404 || r.status === 405) throw Object.assign(new Error("Le service admin n'est pas encore branché dans Cloudflare : suis le guide « Admin : mise en route »."), { status: 404 }); if (r.ok || r.status === 403) throw Object.assign(new Error("Session expirée : recharge la page pour te reconnecter."), { status: 401 }); }
  if (r.status === 401 && j.login && p !== "login") { showLogin(); throw Object.assign(new Error("Connexion nécessaire."), { status: 401, body: j }); }
  if (!r.ok) throw Object.assign(new Error(j.error || `Erreur ${r.status}`), { status: r.status, body: j });
  return j;
}
const F = {};   // chemin -> { sha, obj }
const FMT = {
  "data.json": o => JSON.stringify(o),
  "clubs/clubs.json": o => JSON.stringify(o),
  "state/overrides.json": o => JSON.stringify(o, null, 1),
  "saison2027.json": o => JSON.stringify(o, null, 1).replace(/^ +/gm, ""),
};
async function load(paths) {
  const j = await api("files?paths=" + paths.join(","));
  for (const [p, v] of Object.entries(j.files)) if (!v.error) F[p] = { sha: v.sha, obj: JSON.parse(v.text) }; else if (!F[p]) F[p] = { error: v.error };
}
/* enregistre : relit les fichiers juste avant, applique la modification dessus (ce que la synchro a changé
   entre-temps est gardé), envoie un seul commit ; recommence si la synchro est passée au même moment */
async function save(label, paths, mutate, extra = []) {
  for (let i = 0; i < 3; i++) {
    await load(paths);
    const objs = Object.fromEntries(paths.map(p => [p, clone(F[p].obj)]));
    mutate(objs);
    const files = paths.filter(p => FMT[p](objs[p]) !== FMT[p](F[p].obj)).map(p => ({ path: p, text: FMT[p](objs[p]) }));
    if (!files.length && !extra.length) return false;
    try {
      await api("commit", { method: "POST", body: JSON.stringify({ message: label, base: Object.fromEntries(files.map(f => [f.path, F[f.path].sha])), files: [...files, ...extra] }) });
      for (const f of files) F[f.path].obj = objs[f.path];
      return true;
    } catch (e) { if (e.status !== 409) throw e; await new Promise(r => setTimeout(r, 1500)); }
  }
  throw new Error("Les données changent en ce moment (synchro en cours). Réessaie dans une minute.");
}
async function run(btn, fn) {

    if (!await confirmBox("Supprimer cette course ?", `« ${esc(d.nom)} » sera retirée du site et des données. Elle reste dans l'historique du dépôt.`, "Supprimer", "d")) return;

async function pickPoster(file) {
  if (!file) return;

    const bmp = await createImageBitmap(file, { imageOrientation: "from-image" }).catch(() => null);
    const img = bmp || await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
    const w = img.width, h = img.height, k = Math.min(1, 1600 / Math.max(w, h));
    if (Math.min(w, h) < 300) throw new Error("image trop petite (300 px minimum)");
    const cv = document.createElement("canvas"); cv.width = Math.round(w * k); cv.height = Math.round(h * k);
    const cx = cv.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(img, 0, 0, cv.width, cv.height);
    const url = cv.toDataURL("image/jpeg", .9);
    ED.upload = { url, b64: url.split(",")[1] };
    $(".card:has(#pf)").innerHTML = `<h3 style="margin-top:4px">Affiche</h3>` + posterHTML();
    $("#pf").onchange = e => pickPoster(e.target.files[0]);
    const prm = $("#prm"); if (prm) prm.onclick = () => { ED.upload = null; $(".card:has(#pf)").innerHTML = `<h3 style="margin-top:4px">Affiche</h3>` + posterHTML(); $("#pf").onchange = e => pickPoster(e.target.files[0]); refreshChg(); };

}
function checkRace(d) {
  const pb = [];
  if (!d.nom || !d.nom.trim()) pb.push("le nom est vide");
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d.date || "")) pb.push("la date est vide");
  if (d.fin && d.fin < d.date) pb.push("la date de fin est avant la date");
  if (!d.commune) pb.push("la commune est vide");
  if (d.ll && !(d.ll[0] < -20.8 && d.ll[0] > -21.45 && d.ll[1] > 55.15 && d.ll[1] < 55.9)) pb.push("la position n'est pas à La Réunion");
  for (const k of ["page", "inscription", "fiche"]) if (d[k] && !/^https?:\/\/\S+$/.test(d[k])) pb.push(`le lien « ${lab(k)} » n'est pas une adresse web`);
  (d.epreuves || []).forEach((e, i) => { if (!e.nom) pb.push(`l'épreuve ${i + 1} n'a pas de nom`); if (e.url && !/^https?:\/\/\S+$/.test(e.url)) pb.push(`le lien de l'épreuve ${i + 1} n'est pas une adresse web`); });
  (d.traces || []).forEach((t, i) => { if (!/^https?:\/\/\S+$/.test(t.url || "")) pb.push(`le tracé ${i + 1} n'a pas de lien valide`); });
  return pb;
}
async function saveRace(btn) {
  const d = ED.d;
  if (ED.upload) { delete d.affiche; delete d.affiche_capture; }   // l'adresse de l'ancienne affiche ne correspond plus
  const keys = changedKeys();
  if (!keys.length && !ED.upload) { toast("Aucune modification."); return; }
  if (!d.epreuves || !d.epreuves.length) d.epreuves = [];
  const pb = checkRace(d);
  if (pb.length) { await dialog(`<h3 style="margin-top:0;text-transform:none;letter-spacing:0;color:var(--ink);font-size:17px">À corriger avant d'enregistrer</h3><ul>${pb.map(p => `<li>${esc(p)}</li>`).join("")}</ul>`, [{ label: "OK", v: 1, cls: "p" }]); return; }
  if (ED.isNew) {
    const base = slug(d.nom) + "-" + d.date.slice(0, 7);
    let id = base, n = 2; while (races().some(r => r.id === id)) id = `${base}-${n++}`;
    d.id = id; d.manual = true; if (!d.ll) delete d.ll;
  }
  // champs à verrouiller : ceux modifiés. Pour les épreuves, seulement l'info changée (« ep:<épreuve>:<info> »),
  // sauf si la liste elle-même change (ajout, retrait, nom, ordre) : alors toute la liste.
  const lock = new Set(keys.filter(k => !["poster_xs", "affiche_capture", "manual", "id"].includes(k)));
  let fine = null;   // [[nom, info, valeur ou undefined]]
  if (!ED.isNew && ED.orig && !d.manual && keys.includes("epreuves")) {
    const O = ED.orig.epreuves || [], N = d.epreuves || [];
    if (O.length === N.length && O.every((e, i) => e.nom === N[i].nom)) {
      fine = [];
      O.forEach((e, i) => { for (const k of new Set([...Object.keys(e), ...Object.keys(N[i])])) if (!same(e[k], N[i][k])) { fine.push([e.nom, k, N[i][k]]); lock.add(`ep:${e.nom}:${k}`); } });
      lock.delete("epreuves");
    }
  }
  if (ED.upload) ["poster", "poster_lg", "affiche"].forEach(k => lock.add(k));
  const extra = ED.upload ? [{ path: `posters/in/${d.id}.jpg`, b64: ED.upload.b64 }] : [];
  const label = ED.isNew ? `ajout de ${d.nom}` : `${d.nom} (${[...new Set([...keys.map(lab), ...(ED.upload ? ["affiche"] : [])])].join(", ")})`;
  await run(btn, async () => {
    const ok = await save(label, ["data.json", "state/overrides.json"], o => {
      const D = o["data.json"], O = o["state/overrides.json"];
      if (ED.isNew) { D.races.push(clone(d)); (O.manual = O.manual || []).includes(d.id) || O.manual.push(d.id); return; }
      const r = D.races.find(x => x.id === d.id); if (!r) throw new Error("cette course n'est plus dans les données (passée ?)");
      for (const k of keys) {
        if (k === "epreuves" && fine) {   // seulement les infos changées, sur les épreuves telles qu'elles sont maintenant
          for (const [nom, f, v] of fine) { const e = (r.epreuves || []).find(x => x.nom === nom); if (!e) throw new Error(`l'épreuve « ${nom} » a changé de nom entre-temps, recharge la page`); if (v === undefined) delete e[f]; else e[f] = clone(v); }
          continue;
        }
        if (k in d) r[k] = clone(d[k]); else delete r[k];
      }
      if (!r.manual) {
        const ov = O.overrides = O.overrides || {}, e = ov[d.id] = ov[d.id] || { fields: [], hidden: false };
        e.fields = [...new Set([...e.fields, ...lock])].sort(); e.hidden = !!r.hidden;
      }
    }, extra);
    if (ok === false) { toast("Aucune modification."); return; }
    toast(ED.isNew ? "Course ajoutée : en ligne dans 1 à 2 minutes." : "Enregistré : en ligne dans 1 à 2 minutes.");
    history.back();
  });
}

let ME = {};

const EVG = { raccourci: "Raccourcis", favori: "Favoris", agenda: "Ajout à l'agenda", bandeau: "Bandeau « Nouveau »", sortie: "Clics vers les organisateurs", mode: "Mode choisi (Liste / Scroll…)", arrivee: "Arrivée sur le site par mode", "arrivee-partage": "Arrivées par un lien partagé", scroll: "Actions en mode Scroll", webapp: "Appli sur l'écran d'accueil", saison2027: "Calendrier 2027", jeu: "Jeu", filtre: "Filtres", inscription: "Boutons « S'inscrire »", itineraire: "Itinéraire", contact: "Formulaire de contact", fiche: "Fiches ouvertes", carte: "Carte", partage: "Partages", vue3d: "Vue 3D" };

const addD = (d, n) => new Date(Date.UTC(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8, 10) + n)).toISOString().slice(0, 10);

const dayName = d => JOURS[new Date(d + "T12:00:00Z").getUTCDay()];
const fdl = d => `${dayName(d)} ${fd(d)}`;
// période choisie -> dates (La Réunion), inclusives
function period() {
  const t = TODAY, m = t.slice(0, 8) + "01";
  const P = {
    today: [t, t], yesterday: [addD(t, -1), addD(t, -1)], 7: [addD(t, -6), t], 30: [addD(t, -29), t], 90: [addD(t, -89), t],
    month: [m, t], lastmonth: [addD(m, -1).slice(0, 8) + "01", addD(m, -1)], custom: [ST.from, ST.to], day: [ST.from, ST.from],
  };
  let [from, to] = P[ST.p] || P[30];
  if (!from || !to) [from, to] = P[30];
  if (from > to) [from, to] = [to, from];
  if (to > t) to = t;
  const n = nDays(from, to);
  return { from, to, n, single: n === 1, label: n === 1 ? fdl(from) + (from === t ? " (aujourd'hui, jusqu'à maintenant)" : "") : `du ${fd(from)} au ${fd(to)} · ${n} jours` };
}
const prevPeriod = P => ({ from: addD(P.from, -P.n), to: addD(P.from, -1), n: P.n });
// heures exactes : minuit à La Réunion -> minuit du lendemain (ou maintenant pour aujourd'hui)
const iso = ms => new Date(ms).toISOString().replace(/\.\d+Z$/, "Z");
const gcR = P => ({ start: iso(Date.parse(P.from + "T00:00:00+04:00")), end: P.to >= TODAY ? iso(Math.ceil(Date.now() / 3600e3) * 3600e3) : iso(Date.parse(addD(P.to, 1) + "T00:00:00+04:00")) });

document.addEventListener("click", e => { const b = e.target.closest(".inf"); if (!b) return; e.preventDefault(); e.stopPropagation(); dialog(`<h3 style="margin-top:0;text-transform:none;letter-spacing:0;color:var(--ink);font-size:17px">${esc(b.dataset.ti)}</h3><p style="white-space:pre-line;font-size:14.5px;line-height:1.5">${esc(b.dataset.info)}</p>`, [{ label: "Compris", v: 1, cls: "p" }]); }, true);
function hbars(items, max, attr) {

}
// barres : un point par jour (ou par heure) ; les jours sont cliquables pour voir le détail
function bars(pts, { unit = "visite", clickDay = false, hours = false } = {}) {
  const W = 700, H = 150, n = pts.length, max = Math.max(1, ...pts.map(d => d.n)), bw = (W - 2) / Math.max(1, n);
  const step = Math.pow(10, Math.floor(Math.log10(max))), top = Math.ceil(max / step) * step;
  const y = v => H - 2 - v / top * (H - 10);
  const pl = v => `${nf(v)} ${unit}${v > 1 ? "s" : ""}`;
  const lab = d => hours ? `${d.h} h – ${d.h + 1} h` : fdl(d.day);
  const ticks = hours ? [0, 6, 12, 18, 23].map(h => [h / 24 * 100, h + " h"]) : [0, Math.floor((n - 1) / 2), n - 1].filter((x, i, a) => a.indexOf(x) === i).map(i => [(i + .5) / n * 100, fd(pts[i]?.day).replace(/ \d{4}$/, "")]);
  const avg = Math.round(pts.reduce((a, d) => a + d.n, 0) / Math.max(1, n));
  return `<div class="chartw"><svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${hours ? "Par heure" : "Par jour"}">
    <line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}"/><line x1="0" x2="${W}" y1="${y(top)}" y2="${y(top)}" stroke-dasharray="2 4"/>
    ${pts.map((d, i) => { const h = Math.max(d.n ? 2 : 0, y(0) - y(d.n)), x = i * bw + 1, w = Math.max(1, bw - 2); const we = !hours && [0, 6].includes(new Date(d.day + "T12:00:00Z").getUTCDay()); return `<rect class="${we ? "we" : ""}${clickDay ? " clk" : ""}" ${clickDay ? `data-day="${d.day}"` : ""} data-tip="${esc(lab(d))} : ${pl(d.n)}${clickDay ? " · toucher pour le détail" : ""}" x="${x}" y="${y(0) - h}" width="${w}" height="${h}" rx="${Math.min(4, w / 2)}"/><rect class="hit${clickDay ? " clk" : ""}" ${clickDay ? `data-day="${d.day}"` : ""} data-tip="${esc(lab(d))} : ${pl(d.n)}${clickDay ? " · toucher pour le détail" : ""}" x="${i * bw}" y="0" width="${bw}" height="${H}"/>`; }).join("")}
  </svg><div class="axis">${ticks.map(([p, t]) => `<span style="left:${p}%">${esc(t)}</span>`).join("")}<b>max. ${nf(max)} · moy. ${nf(avg)}${hours ? " / heure" : " / jour"}</b></div></div>`;
}
let CHV = "jour";   // vue du graphique d'audience : jour, semaine, compare
try { CHV = localStorage.getItem("adm-chv") || "jour"; } catch (e) { }
const monday = d => addD(d, -((new Date(d + "T12:00:00Z").getUTCDay() + 6) % 7));
const JC = ["lun.", "mar.", "mer.", "jeu.", "ven.", "sam.", "dim."];
// total par semaine (lundi → dimanche) ; une semaine coupée par la période est signalée
function weekBars(days) {
  const W = {}; for (const d of days) { const m = monday(d.day); (W[m] = W[m] || { day: m, n: 0, k: 0 }); W[m].n += d.n; W[m].k++; }
  const pts = Object.values(W).sort((a, b) => a.day.localeCompare(b.day));
  const Wd = 700, H = 150, n = pts.length, max = Math.max(1, ...pts.map(d => d.n)), bw = (Wd - 2) / Math.max(1, n);
  const step = Math.pow(10, Math.floor(Math.log10(max))), top = Math.ceil(max / step) * step, y = v => H - 2 - v / top * (H - 10);
  const lab = d => `semaine du ${fd(d.day)}${d.k < 7 ? ` (${d.k} jour${d.k > 1 ? "s" : ""} sur 7)` : ""}`;
  return `<div class="chartw"><svg class="chart" viewBox="0 0 ${Wd} ${H}" preserveAspectRatio="none" role="img" aria-label="Par semaine">
    <line x1="0" x2="${Wd}" y1="${y(0)}" y2="${y(0)}"/><line x1="0" x2="${Wd}" y1="${y(top)}" y2="${y(top)}" stroke-dasharray="2 4"/>
    ${pts.map((d, i) => { const h = Math.max(d.n ? 2 : 0, y(0) - y(d.n)), x = i * bw + 4, w = Math.max(1, bw - 8), tip = `${lab(d)} : ${nf(d.n)} visites · toucher pour voir la semaine`; return `<rect class="clk${d.k < 7 ? " part" : ""}" data-week="${d.day}" data-tip="${esc(tip)}" x="${x}" y="${y(0) - h}" width="${w}" height="${h}" rx="4"/><rect class="hit clk" data-week="${d.day}" data-tip="${esc(tip)}" x="${i * bw}" y="0" width="${bw}" height="${H}"/>`; }).join("")}
  </svg><div class="axis">${pts.map((d, i) => n <= 8 || i % Math.ceil(n / 6) === 0 ? `<span style="left:${(i + .5) / n * 100}%">${fd(d.day).replace(/ \d{4}$/, "")}</span>` : "").join("")}<b>max. ${nf(max)} / semaine · semaines incomplètes en plus clair</b></div></div>`;
}
// comparer les semaines : les 7 jours côte à côte, une barre par semaine (la plus récente la plus foncée)
function weekCompare(days) {
  const W = {}; for (const d of days) { const m = monday(d.day); (W[m] = W[m] || Array(7).fill(null))[(new Date(d.day + "T12:00:00Z").getUTCDay() + 6) % 7] = d; }
  const wk = Object.keys(W).sort().slice(-6), k = wk.length;
  if (!k) return `<div class="empty">Pas de données</div>`;
  const Wd = 700, H = 170, max = Math.max(1, ...wk.flatMap(m => W[m].map(d => d ? d.n : 0))), gw = Wd / 7, bw = (gw - 10) / k;
  const step = Math.pow(10, Math.floor(Math.log10(max))), top = Math.ceil(max / step) * step, y = v => H - 2 - v / top * (H - 10);
  const op = i => (0.3 + 0.7 * (i + 1) / k).toFixed(2);
  return `<div class="chartw"><svg class="chart" viewBox="0 0 ${Wd} ${H}" preserveAspectRatio="none" role="img" aria-label="Comparaison des semaines">
    <line x1="0" x2="${Wd}" y1="${y(0)}" y2="${y(0)}"/><line x1="0" x2="${Wd}" y1="${y(top)}" y2="${y(top)}" stroke-dasharray="2 4"/>
    ${wk.map((m, i) => W[m].map((d, j) => { if (!d) return ""; const h = Math.max(d.n ? 2 : 0, y(0) - y(d.n)), x = j * gw + 5 + i * bw, tip = `${fdl(d.day)} (semaine du ${fd(m)}) : ${nf(d.n)} visites · toucher pour le détail`; return `<rect class="clk" style="opacity:${op(i)}" data-day="${d.day}" data-tip="${esc(tip)}" x="${x + 1}" y="${y(0) - h}" width="${Math.max(1, bw - 2)}" height="${h}" rx="${Math.min(3, bw / 3)}"/>`; }).join("")).join("")}
  </svg><div class="axis wk">${JC.map((j, i) => `<span style="left:${(i + .5) / 7 * 100}%">${j}</span>`).join("")}</div></div>
  <div class="lgd">${wk.map((m, i) => `<span><i style="opacity:${op(i)}"></i>sem. du ${fd(m).replace(/ \d{4}$/, "")}${i === k - 1 ? " (la plus récente)" : ""}</span>`).join("")}</div>`;

  const inp = u => u == null || u < 0 ? "–" : (v => `<span class="vit ${v <= 200 ? "g" : v <= 500 ? "m" : "b"}">${v <= 200 ? "✓" : v <= 500 ? "~" : "✕"} ${Math.round(v)} ms</span>`)(u / 1000);
  const Q = "quantiles{largestContentfulPaintP75 cumulativeLayoutShiftP75 interactionToNextPaintP75}";

      cwvd: rumWebVitalsEventsAdaptiveGroups(limit:6,orderBy:[count_DESC],filter:{siteTag:$site,datetime_geq:$s,datetime_leq:$e}){count dimensions{deviceType} ${Q}}
    }}}`, { s, e });
    if (j.errors && j.errors.length && !j.data) throw new Error(j.errors[0].message);
    const A = (j.data?.viewer?.accounts || [])[0] || {}, q = (A.cwv || [])[0]?.quantiles || {}, vis = (A.vis || [])[0];
    const row = (l, g) => `<tr><td>${l}</td><td>${lcp(g.quantiles.largestContentfulPaintP75)}</td><td>${cls(g.quantiles.cumulativeLayoutShiftP75)}</td><td>${inp(g.quantiles.interactionToNextPaintP75)}</td><td class="n">${nf(g.count)}</td></tr>`;

        ${kpi("Réactivité (INP)", inp(q.interactionToNextPaintP75), "bon : 200 ms ou moins", TXT.vitesse)}
        ${kpi("Visites mesurées", nf(vis?.sum?.visits || 0), `${nf(vis?.count || 0)} pages vues`, "Visites mesurées par l'outil de vitesse de Cloudflare. C'est un échantillon : le nombre sert à juger si les mesures de vitesse sont fiables (au moins quelques dizaines), pas à compter l'audience.")}
      </div>
      <div class="two">
        <div class="card ovw"><h3 style="margin-top:2px">Par page</h3><table class="t"><tr><th>Page</th><th>LCP</th><th>CLS</th><th>INP</th><th class="n">Mesures</th></tr>${(A.cwvp || []).filter(g => !/^\/admin/.test(g.dimensions.requestPath)).map(g => row(esc(g.dimensions.requestPath === "/" ? "Accueil" : g.dimensions.requestPath), g)).join("") || `<tr><td colspan="5" class="empty">Pas de mesure</td></tr>`}</table></div>
        <div class="card ovw"><h3 style="margin-top:2px">Par appareil</h3><table class="t"><tr><th>Appareil</th><th>LCP</th><th>CLS</th><th>INP</th><th class="n">Mesures</th></tr>${(A.cwvd || []).map(g => row(esc(({ mobile: "Téléphone", desktop: "Ordinateur", tablet: "Tablette" })[g.dimensions.deviceType] || g.dimensions.deviceType), g)).join("") || `<tr><td colspan="5" class="empty">Pas de mesure</td></tr>`}</table></div>
      </div>`;
  } catch (er) { cw.innerHTML = `<div class="card note w">Vitesse indisponible : ${esc(er.message)}</div>`; }
  try {
    const j = await cfPost(`query($zone:String!,$sd:Date!,$ed:Date!){viewer{zones(filter:{zoneTag:$zone}){
      d: httpRequests1dGroups(limit:100,orderBy:[date_ASC],filter:{date_geq:$sd,date_leq:$ed}){dimensions{date} sum{requests cachedRequests threats bytes pageViews} uniq{uniques}}
    }}}`, { sd: P.from, ed: P.to });
    if (j.errors && j.errors.length && !j.data) throw new Error(j.errors[0].message);
    const D = (j.data?.viewer?.zones || [])[0]?.d || [];
    const t = D.reduce((a, g) => { for (const k in g.sum) a[k] = (a[k] || 0) + (g.sum[k] || 0); a.uniques = (a.uniques || 0) + (g.uniq?.uniques || 0); return a; }, {});
    const days = D.map(g => ({ day: g.dimensions.date, n: g.sum.requests || 0 })), thr = D.map(g => ({ day: g.dimensions.date, n: g.sum.threats || 0 }));
    let det = { data: null };
    try { det = await cfPost(`query($zone:String!,$sd:Date!,$ed:Date!){viewer{zones(filter:{zoneTag:$zone}){
      x: httpRequests1dGroups(limit:100,filter:{date_geq:$sd,date_leq:$ed}){sum{countryMap{clientCountryName requests threats} responseStatusMap{edgeResponseStatus requests} threatPathingMap{threatPathingName requests}}}
    }}}`, { sd: P.from, ed: P.to }); } catch (e) { }
    const X = (det.data?.viewer?.zones || [])[0]?.x || [];
    const agg = (key, name, val) => { const o = {}; for (const g of X) for (const r of g.sum?.[key] || []) o[r[name]] = (o[r[name]] || 0) + (r[val] || 0); return Object.entries(o).map(([l, n]) => ({ l, n })).filter(x => x.n).sort((a, b) => b.n - a.n); };
    const tTypes = {}; for (const x of agg("threatPathingMap", "threatPathingName", "requests")) tTypes[thrName(x.l)] = (tTypes[thrName(x.l)] || 0) + x.n;
    const cn = c => { try { return new Intl.DisplayNames(["fr"], { type: "region" }).of(c) || c; } catch (e) { return c; } };
    const tCountries = agg("countryMap", "clientCountryName", "threats").slice(0, 8).map(x => ({ ...x, l: cn(x.l) }));
    const st = agg("responseStatusMap", "edgeResponseStatus", "requests"), cnt = f => st.filter(x => f(+x.l)).reduce((a, x) => a + x.n, 0);
    const codes = [["Servies normalement", cnt(c => c >= 200 && c < 300 || c === 304)], ["Redirigées", cnt(c => c >= 300 && c < 400 && c !== 304)], ["Introuvables (404)", cnt(c => c === 404)], ["Refusées (403)", cnt(c => c === 403)], ["Autres refus (4xx)", cnt(c => c >= 400 && c < 500 && c !== 403 && c !== 404)], ["Erreurs du serveur (5xx)", cnt(c => c >= 500)]].filter(x => x[1]).map(([l, n]) => ({ l, n }));
    tb.innerHTML = `<div class="kpis">
        ${kpi("Requêtes", nf(t.requests || 0), "robots compris", TXT.requetes)}
        ${kpi("Servies depuis le cache", `${t.requests ? Math.round((t.cachedRequests || 0) / t.requests * 100) : 0} %`, "", TXT.cache)}
        ${kpi("Menaces bloquées", nf(t.threats || 0), (t.threats || 0) ? "requêtes refusées par Cloudflare" : "aucune", TXT.menaces)}
        ${kpi("Adresses différentes", nf(t.uniques || 0), "robots compris", TXT.uniques)}
        ${kpi("Données envoyées", `${((t.bytes || 0) / 1e6 >= 1000 ? ((t.bytes || 0) / 1e9).toFixed(2) + " Go" : Math.round((t.bytes || 0) / 1e6) + " Mo").replace(".", ",")}`, "", TXT.donnees)}
      </div>
      ${days.length > 1 ? `<div class="card"><h3 style="margin-top:2px">Requêtes par jour</h3>${bars(days, { unit: "requête", clickDay: true })}</div>` : ""}
      <div class="two">
        <div class="card"><h3 style="margin-top:2px">Menaces bloquées : de quel type ? ${info("Menaces bloquées", TXT.menaces)}</h3>${Object.keys(tTypes).length ? hbars(Object.entries(tTypes).map(([l, n]) => ({ l, n })).sort((a, b) => b.n - a.n)) : `<p class="hint">${(t.threats || 0) ? "Détail non disponible sur l'offre gratuite." : "Aucune menace sur la période."}</p>`}
          ${tCountries.length ? `<p class="hint" style="margin:10px 0 4px">D'où elles viennent :</p>${hbars(tCountries)}` : ""}
          ${thr.some(x => x.n) && thr.length > 1 ? `<p class="hint" style="margin:10px 0 4px">Par jour :</p>${bars(thr, { unit: "menace" })}` : ""}</div>
        <div class="card"><h3 style="margin-top:2px">Réponses du site ${info("Réponses du site", TXT.codes)}</h3>${codes.length ? hbars(codes) : `<p class="hint">Détail non disponible.</p>`}</div>
      </div>`;

  $("#pw").focus();
  $("#login").onsubmit = async e => {
    e.preventDefault(); const b = e.target.querySelector("button"); b.disabled = true; $("#pwerr").textContent = "";
    try { await api("login", { method: "POST", body: JSON.stringify({ password: $("#pw").value }) }); location.reload(); }
    catch (err) { $("#pwerr").textContent = err.message; b.disabled = false; $("#pw").select(); }
  };
}
$("#logout").onclick = async e => { e.preventDefault(); await api("logout").catch(() => { }); location.reload(); };

/* ============ démarrage ============ */
(async () => {
  try {
    ME = await api("me");
    $("#who").textContent = ME.email && ME.email !== "admin" ? ME.email : "";
    $("#logout").hidden = false;
    await load(["data.json", "state/overrides.json", "clubs/clubs.json", "saison2027.json"]);
    try { const t = localStorage.getItem("adm-tab"); if (t && $(`#tabs [data-t="${t}"]`)) { TAB = t; $$("#tabs button").forEach(x => x.setAttribute("aria-selected", x.dataset.t === t)); } } catch (e) { }
    render();
    if (TAB !== "messages") loadMsgs().catch(() => { });   // pastille du nombre de messages à traiter
  } catch (e) {
    if (e.status === 401) return;   // écran de connexion affiché
    $("#view").innerHTML = `<div class="card note w" style="margin-top:20px"><b>${e.status === 403 ? "Accès refusé." : "Impossible de charger l'admin."}</b><br>${esc(e.message)}</div>`;
  }
})();
</script>
</body>
</html>
