name: Synchro horaire des sources
# Every hour (free): removes past races and refreshes deadlines / "complet" / times from the
# UTOI and Top Chrono APIs (tools/sync_sources.py), then regenerates the course pages.
# Missing posters are taken from the races' own pages or WeRun (tools/posters.py), missing tracks
# from Trace de Trail / Openrunner links (tools/tracks.py); tools/triage.py lists the sources that
# changed for the Claude update (state/todo.json), race-day weather from MET Norway
# (tools/weather.py, every 3 hours); new races and tracks are added by the
# Claude update (3 times a day).
on:
  schedule:
    - cron: "17 * * * *"
  # also right after the Claude update pushes data.json, so the épreuve status, links and prices it may
  # have dropped come back at once (pushes made by this workflow itself do not trigger it again)
  push:
    branches: [main]
    paths: [data.json]
  workflow_dispatch:
permissions:
  contents: write
  issues: write   # alarm: an issue (e-mailed by GitHub) when a source fails 3 runs in a row
concurrency:
  group: course-pages
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }   # the version before a push is the reference of the checks
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Synchro des sources
        run: python tools/sync_sources.py $([ "$GITHUB_EVENT_NAME" = push ] && echo --all)
      - name: Affiches et tracés manquants
        run: |
          pip install -q pillow
          python tools/posters.py
          python tools/tracks.py
          python tools/profiles.py
      - name: Météo des courses (MET Norway, toutes les 3 h)
        run: python tools/weather.py
      - name: Tri pour la mise à jour Claude (sources modifiées)
        run: python tools/triage.py
      - name: Pages des courses
        run: |
          # always: a course page also changes when a deadline passes without any data change
          python tools/gen_pages.py
      - name: Alarme sources
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/health_alarm.py
      - name: Alertes contrôles
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/alerts.py "$RUNNER_TEMP/controls.json"
      - name: Commit
        run: |
          git config user.name "Dossard Pei"; git config user.email "noreply@dossardpei.re"
          git add -A data.json profiles.json posters state/posters.json course og sitemap.xml tools/first_seen.json state/health.json state/journal.json state/nouveautes.json verif.json weather.json gpx state/tracks.json state/watch.json state/todo.json
          if git diff --cached --quiet; then echo "rien à publier"; exit 0; fi
          git commit -m "Synchro sources [pages]"
          git pull --rebase origin main || { git rebase --abort; echo "conflit avec une autre mise à jour : on réessaiera dans une heure"; exit 0; }
          git push origin main
